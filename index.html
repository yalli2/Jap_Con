const IDX = [{"id": 1, "ja": "あいさつ", "ko": "인사하기", "en": "Greetings", "g": 1, "t": true, "d": "인사로 관계가 시작됩니다. 인사를 잘 나누며 즐거운 사회생활을 해 보세요.", "n": 33, "np": 9, "kw": "안녕하세요(아침 인사). / 좋은 아침. 안녕하세요(낮 인사). 안녕하세요(저녁 인사). 안녕히 주무세요. / 잘 자. 잘 지내세요? ― 네, 잘 지내요. 잘 먹겠습니다. 잘 먹었습니다. 감사합니다. / 고마워. 안녕히 가세요(안녕히 계세요). おはようございます。 / おはよう。 こんにちは。 こんばんは。 おやすみなさい。 / おやすみ。 元気ですか。 ― ええ、元気ですよ。 いただきます。 ごちそうさまでした。 / ごちそうさま。 ありがとうございます。 / ありがとう。 さようなら。"}, {"id": 2, "ja": "生活", "ko": "일상생활", "en": "Daily life", "g": 1, "t": true, "d": "살아가는 데 꼭 필요한 기본 표현입니다. 억양에 주의하세요.", "n": 31, "np": 9, "kw": "물 좀 부탁합니다. 이걸로 부탁합니다. 저기요! 죄송합니다. 저기요! 실례합니다. 죄송합니다, 잠시만요. (늘) 감사합니다. 여기 있습니다. / 드세요. お水をお願いします。 これをお願いします。 お願いします！ すみません。 すみません！ すみません。 すみません。 (いつも)すみません。 どうぞ。"}, {"id": 3, "ja": "緊急", "ko": "긴급 상황", "en": "Emergency", "g": 1, "t": true, "d": "위급할 때 쓰는 표현입니다. 바로 말할 수 있도록 잘 익혀 두세요.", "n": 33, "np": 9, "kw": "아파요! 다쳤어요. 누구든 와 주세요! 도와주세요! 구급차를 불러 주세요! 경찰을 불러 주세요! 위험해요! 그만하세요. 한 번 더 말해 주세요. 痛い。 けがをしました。 誰か来てください！ 助けてください！ 救急車を呼んでください！ 警察を呼んでください！ 危ない！ やめてください。 もう一度言ってください。"}, {"id": 4, "ja": "あいさつをする", "ko": "상황별 인사", "en": "Greetings", "g": 2, "t": true, "d": "상황에 따라 인사 표현이 달라집니다. 알맞은 인사를 골라 쓰면 대화가 훨씬 즐거워져요.", "n": 33, "np": 9, "kw": "안녕하세요(아침 인사). 오랜만입니다. / 오랫동안 연락을 못 드렸습니다. 별일 없으세요? ― 네, 덕분에 잘 지냅니다. 요즘 컨디션은 어때요? ― 그저 그래요. 수고하셨습니다. / 수고해. 먼저 가보겠습니다. 실례합니다. 그럼 이만 실례하겠습니다. 그럼 또 봐. おはようございます。 お久しぶりです。 / ご無沙汰しております。 お変わりありませんか。 ― はい、おかげさまで。 最近、調子はどうですか。 ― まあまあです。 お疲れさまです。 / お疲れ。 お先に失礼します。 失礼します。 では、失礼します。 じゃ、またね。"}, {"id": 5, "ja": "自己紹介をする", "ko": "자기소개하기", "en": "Self-introduction", "g": 2, "t": true, "d": "자기소개를 할 기회는 많습니다. 인맥을 넓힐 좋은 기회이기도 해요.", "n": 32, "np": 8, "kw": "처음 뵙겠습니다. 스미스라고 합니다. 호주 출신입니다. 올해 스무 살이 됩니다. 대학에서는 심리학을 전공하고 있습니다. 취미는 축구 관람과 여행입니다. 세계 일주 여행을 하는 것이 꿈입니다. 판매 일을 하고 있습니다. 앞으로 신세 지겠습니다만, 잘 부탁드립니다. はじめまして。スミスと申します。 オーストラリア出身です。 今年、20歳になります。 大学では心理学を専攻しています。 趣味はサッカー観戦と旅行です。 世界一周旅行をするのが夢です。 販売の仕事をしています。 これからお世話になりますが、よろしくお願いします。"}, {"id": 6, "ja": "お礼を言う・謝る", "ko": "감사와 사과", "en": "Thanking and apologizing", "g": 2, "t": true, "d": "감사와 고마움을 나타내는 표현은 여러 가지가 있습니다.", "n": 33, "np": 9, "kw": "감사합니다. 고마워! 여러모로 신세를 많이 졌습니다. 감사했습니다. 늦어서 죄송했습니다. 정말 죄송했습니다. 폐를 끼쳐서 정말 죄송합니다. 일전에는 실례했습니다. 미안해요. 미안, 용서해 줘! ありがとうございます。 ありがとう！ いろいろとお世話になり、ありがとうございました。 遅くなってすみませんでした。 申し訳ありませんでした。 ご迷惑をおかけして申し訳ありません。 先日は失礼いたしました。 ごめんなさい。 ごめん、許して！"}, {"id": 7, "ja": "依頼する", "ko": "부탁하기", "en": "Asking", "g": 2, "t": true, "d": "부탁하는 법, 도움을 구하는 법을 익혀 보세요.", "n": 28, "np": 8, "kw": "잠깐 부탁드리고 싶은 일이 있는데요. 잠깐 도와주실 수 있을까요? 이걸 같이 옮겨 주셨으면 하는데요. 그거 하는 방법을 가르쳐 주지 않을래요? 조금만 더 기다려 주실 수 있을까요? 내일 아침 9시에 역으로 와 줄 수 있어? 이시카와 씨에게 연락해 줄래? 일본문화론 노트 좀 빌려 줄래? ちょっとお願いしたいことがあるんですが。 ちょっと手伝っていただけませんか。 これを一緒に運んでほしいんですが。 それのやり方を教えてくれませんか。 もう少し待っていただけませんか。 明日の朝、9時に駅に来てもらえる？ 石川さんに連絡しといてくれる？ 日本文化論のノート、貸してくれない？"}, {"id": 8, "ja": "誘う", "ko": "권유하기", "en": "Inviting", "g": 2, "t": false, "d": "친구를 사귈 때 쓰는 표현입니다.", "n": 32, "np": 9, "kw": "괜찮으시다면 다음에 식사하러 가지 않을래요? 다음에 가 보지 않을래요? 지금부터 식사하러 갈 건데, 같이 어때요? 다나카 씨도 함께하시겠어요? 다음에 다 같이 노래방에 가요. 다음 주 파티에는 꼭 와 주세요. 한 잔 더 하시겠어요? 지금 시간 있어? 다음 주에 비는 날 있어? よかったら、今度、食事に行きませんか。 今度行ってみませんか。 今から食事に行くけど、一緒にどうですか。 田中さんもご一緒にいかがですか。 今度、みんなでカラオケに行きましょう。 来週のパーティーにはぜひいらしてください。 もう一杯いかがですか。 今、時間ある？ 来週、空いてる日ある？"}, {"id": 9, "ja": "誘いを受ける・断る", "ko": "초대 수락과 거절", "en": "Accepting and declining invitations", "g": 2, "t": false, "d": "초대를 정중하게 받아들이고 거절하는 법을 익혀 보세요.", "n": 33, "np": 8, "kw": "좋네요. 네, 기꺼이요. 꼭 함께하게 해 주세요. 초대해 주셔서 감사합니다. 죄송하지만, 그날은 좀… 오늘은 일정이 있어서요… 갈 수 있으면 갈게요. 죄송해요, 다음에 또 불러 주세요. いいですね。 はい、喜んで。 ぜひ、ご一緒させてください。 ご招待いただき、ありがとうございます。 すみませんが、その日はちょっと…。 今日は予定がありますので…。 行けたら行きます。 すみません、また誘ってください。"}, {"id": 10, "ja": "質問する", "ko": "질문하기", "en": "Asking a question", "g": 2, "t": true, "d": "질문은 새로운 언어로 말하기의 첫걸음입니다. 많이 물어보세요!", "n": 33, "np": 9, "kw": "하나 물어봐도 될까요? 잠깐 물어봐도 돼? 왜 그렇게 생각했어요? / 왜 그렇게 생각했어? 리포트 주제는 무엇인가요? 리포트 마감은 언제인가요? 접수처(안내 데스크)는 어디인가요? 내일 시합이 몇 시부터였더라? 영화는 어땠어요? 개랑 고양이 중에 어느 쪽이 좋아? 一つ聞いてもいいですか。 ちょっと聞いてもいい？ なぜそう思ったのですか。 / どうしてそう思ったの？ レポートのテーマは何ですか。 レポートの締め切りはいつですか。 受付はどこですか。 明日の試合って、何時か plaining", "g": 2, "t": false, "d": "더 편하게 살기 위해 불만을 말해야 할 때가 있습니다.", "n": 33, "np": 9, "kw": "이건 너무하네요. 정말 싫어져요. 지긋지긋해요. 곤란하네요. 아, 곤란하네. 어떻게 된 거예요? 납득할 수 없습니다. 제대로 해 주세요. 어떻게든 해 주세요. これはひどいです。 嫌になります。 うんざりです。 困りますね。 困ったなあ。 どうなってるんですか。 納得できません。 ちゃんとやってください。 何とかしてください。"}, {"id": 17, "ja": "予約する", "ko": "예약하기", "en": "Making a reservation", "g": 2, "t": true, "d": "여행사, 식당, 미용실 등 예약하면 좋은 곳이 많습니다.", "n": 31, "np": 9, "kw": "항공권을 예약하고 싶은데요. 12월 1일 하네다 출발, 싱가포르행으로 부탁합니다. 몇 시 몇 분 편이 있나요? 그다음 편은 몇 시 몇 분인가요? 예약을 부탁드리고 싶은데요… 예산은 음료 포함 1인당 3500엔입니다. 취소 수수료는 언제부터 드나요? 예약을 변경하고 싶은데요. 예약을 취소하고 싶은데요. 航空券の予約をしたいんですが。 12月1日の羽田発、シンガポール行きでお願いします。 何時何分の便がありますか。 その次は何時何分ですか。 予約をお願いしたいのですが…。 予算は、飲み物を入れて一人3500円です。 キャンセル料はいつからかかりますか。 予約を変更したいんですが。 予約をキャンセルしたいんですが。"}, {"id": 18, "ja": "希望を言う", "ko": "희망 말하기", "en": "Requesting", "g": 2, "t": true, "d": "전철은 일본의 대도시에서 자동차보다 편리하고 꼭 필요한 교통수단입니다. 원하는 것을 분명하게 말해 보세요.", "n": 33, "np": 9, "kw": "더 싼 것은 없나요? 조금 더 알기 쉽게 설명해 주실 수 없을까요? 파스타가 먹고 싶어요. 가능한 한 가까운 가게가 좋아요. 가능하면 같이 가 주세요. 한번 가 보고 싶어요. 만날 수 있다면 기쁘겠어요. 내일까지 답을 받고 싶어요. 너무 추운 곳에는 가고 싶지 않아요. もっと安いのはないですか。 もう少しわかりやすく説明してもらえませんか。 パスタが食べたいです。 なるべく近いお店がいいです。 できれば一緒に行ってください。 一度行ってみたいです。 会えたらうれしいです。 明日までに返事がほしいです。 あまり寒いところには行きたくないです。"}, {"id": 19, "ja": "N1はN2です／N1はAです", "ko": "～は～です", "en": "N1 wa N2 desu. / N1 wa A desu.", "g": 3, "t": false, "d": "이 간단한 문형 하나로 많은 것을 말할 수 있습니다.", "n": 33, "np": 9, "kw": "저는 밀러입니다. 이쪽은 스미스 씨입니다. 스미스 씨는 제 친구입니다. 저는 교사입니다. 어머님은 안녕하세요? 네, 변함없이 잘 지냅니다. 저건 무슨 빌딩인가요? 아, 저건 롯폰기 힐스예요. 예쁜 빌딩이네요. 私はミラーです。 こちらはスミスさんです。 スミスさんは私の友達です。 私は教師です。 お母さんはお元気ですか。 はい、あいかわらず元気です。 あれは何というビルですか。 ああ、あれは六本木ヒルズです。 きれいなビルですね。"}, {"id": 20, "ja": "好き・嫌い・得意・下手", "ko": "좋아함·싫어함·잘함·못함", "en": "Like, do not like, be good at, be not good at", "g": 3, "t": false, "d": "이 과를 마치면 일본어 회화가 '좋아지고' '잘하게' 될 거예요.", "n": 33, "np": 8, "kw": "저는 낫토를 좋아해요. / 싫어해요. 저는 수학을 아주 좋아해요. / 아주 싫어해요. 운동은 잘하는데 공부는 서툴러요. 사람들 앞에서 말하는 것은 서툴러요. 요리는 자신 있어요. 먹는 건 빨라요. 밝은 색이 좋아요. 영어를 잘하시네요. 私は納豆が好きです。 / 嫌いです。 私は数学が大好きです。 / 大嫌いです。 スポーツは得意ですが、勉強は苦手です。 人前で話すのは苦手です。 料理は得意です。 食べるのは早いですよ。 明るい色がいいです。 英語がお上手ですね。"}, {"id": 21, "ja": "形容詞", "ko": "형용사", "en": "Adjectives", "g": 3, "t": false, "d": "형용사를 많이 쓰면 대화가 더욱 생생해집니다.", "n": 30, "np": 8, "kw": "오늘은 덥네요. 오늘은 정말 춥네요. 어제는 달이 무척 예뻤어요. 우리나라보다 도쿄가 인구가 많아요. 미야자키 애니메이션 중에서 어느 것이 가장 재미있나요? 제가 본 것 중에서는 「토토로」가 가장 재미있었어요. 인도 카레와 스리랑카 카레 중에 어느 쪽이 더 매워요? 인도 카레가 더 매워요. 今日は暑いですね。 今日はすごく寒いですね。 昨日は、月がとてもきれいでした。 私の国より東京のほうが人口が多いです。 宮崎アニメの中で、どれが一番おもしろいですか。 私が見た中では、『トトロ』が一番おもしろかったです。 インドのカレーとスリランカのカレーと、どちらのほうがからいですか。 インドのカレーのほうがからいです。"}, {"id": 22, "ja": "ある・いる", "ko": "존재 표현 (ある・いる)", "en": "Expressing existence", "g": 3, "t": true, "d": "기본 동사 두 개를 확실히 익혀 두세요.", "n": 31, "np": 8, "kw": "교토에는 일본식 료칸이 많이 있습니다. 다다미방이 있나요? 이 근처에 우체국이 있나요? 네, 저 편의점 옆에 있어요. 다음 주에 교토에서 축제가 있어요. 저기, 잠깐 질문이 있는데요. 형제가 있나요? 지금 집에는 아무도 없어요. 京都には、和風の旅館がたくさんあります。 たたみの部屋がありますか。 この近くに、郵便局はありますか。 はい、あのコンビニのとなりにあります。 来週、京都でお祭りがあります。 あのう、ちょっと質問があるんですが。 兄弟はいますか。 今、家にはだれもいません。"}, {"id": 23, "ja": "ほしい・〜たい・〜たがる", "ko": "~하고 싶다 / 갖고 싶다", "en": "Want to ~ / Would like to", "g": 3, "t": true, "d": "일본어로 하고 싶은 것을 말할 수 있다면 일본어 실력이 늘고 있다는 증거입니다.", "n": 33, "np": 9, "kw": "물이 마시고 싶어요. 빨리 점심을 먹고 싶어요. 뭐가 먹고 싶어요? 3년 후에 내 회사를 만들고 싶어요. 장래에는 통역사가 되고 싶다고 생각하고 있어요. 후지산에 올라 보고 싶어요. 전부터 이 영화를 보고 싶다고 생각하고 있었어요. 겨울 코트를 갖고 싶어요. 여동생은 빨리 결혼하고 싶어 해요. 水が飲みたいです。 早くお昼を食べたいです。 何が食べたいですか。 3年後に自分の会社を作りたいです。 将来は通訳になりたいと思っています。 富士山に登ってみたいです。 前からこの映画を見たいと思っていました。 冬のコートがほしいです。 妹は早く結婚したがっています。"}, {"id": 24, "ja": "連体修飾節", "ko": "명사 꾸미기", "en": "Qualifying nouns", "g": 3, "t": false, "d": "수식하는 말을 쓰면 두 문장을 하나로 합칠 수 있습니다. 접속사 같은 역할이라고 생각하세요.", "n": 28, "np": 8, "kw": "이건 작년에 하와이에서 산 셔츠예요. 어제 막 산 우산을 잃어버렸어요. 어제 묵은 호텔은 그럭저럭 괜찮았어요. 오늘 간 가게보다 지난번에 간 가게가 훨씬 좋았어요. 이것은 약 800년 전에 지어진 절이에요. 일본의 무역 회사에 다니고 있는 친구를 소개할게요. 저 안경을 쓴 남성이 팀이에요. 아까 이야기하던 사람은 누구예요? これは去年ハワイで買ったシャツです。 昨日買ったばかりのかさをなくしてしまいました。 昨日泊まったホテルはまあまあよかったです。 今日行った店より、この前行った店のほうがずっとよかったです。 これは約800年前に建てられたお寺です。 日本の貿易会社に勤めている友達を紹介します。 あのめがねをかけている男性がティムです。 さっき話していた人は誰ですか。"}, {"id": 25, "ja": "〜てください・〜ないでください", "ko": "~해 주세요 / ~하지 마세요", "en": "~te kudasai / ~naide kudasai", "g": 3, "t": true, "d": "이 문법을 쓰면 일본 사람과 진짜 소통할 수 있습니다.", "n": 33, "np": 8, "kw": "먼저 가세요. 여기에 이메일 주소를 써 주실 수 있을까요? 다음 교차로에서 오른쪽으로 도세요. 여기서 잠깐 기다리고 계세요. 위험하니까 조심하세요. 이건 버리지 마세요. 아직 열지 마세요. 무리하지 마세요. 先に行ってください。 ここにメールアドレスを書いていただけませんか。 次の交差点を右に曲がってください。 ここでちょっと待っていてください。 危ないから気をつけてください。 これは捨てないでください。 まだ開けないでください。 無理をしないでください。"}, {"id": 26, "ja": "〜ませんか・〜ましょうか", "ko": "권유와 제안 (~ませんか / ~ましょうか)", "en": "~masen ka / ~masho ka", "g": 3, "t": false, "d": "제안하고 권유하는 표현입니다. 잘 익혀 두세요.", "n": 30, "np": 8, "kw": "다음에 같이 아키하바라에 가지 않을래요? 짐이 무거워 보이네요. 들어 드릴까요? 슬슬 돌아갈까요? ― 네, 그렇게 해요. 슬슬 돌아가지 않을래요? ― 음, 글쎄요… 나머지는 내일 할까요? 이거 안 먹을래요? 맛있어요. 붐비니까 다른 가게로 하지 않을래요? 가게에 전화해서 물어봐요. 今度、一緒に秋葉原に行きませんか。 荷物、重そうですね。持ちましょうか。 そろそろ帰りましょうか。 ― ええ、そうしましょう。 そろそろ帰りませんか。 ― うーん、そうですねえ…。 続きは明日にしましょうか。 これ食べません？おいしいですよ。 混んでいるから別の店にしませんか。 お店に電話して聞いてみましょうよ。"}, {"id": 27, "ja": "着脱動詞", "ko": "입고 벗는 동사", "en": "The verb \"to wear\"", "g": 3, "t": false, "d": "일본어에는 왜 '입다'를 나타내는 말이 이렇게 많을까요? 여기서 정리합니다.", "n": 29, "np": 8, "kw": "추워서 스웨터를 입어요. / 더워서 스웨터를 벗었어요. 추운 날은 스타킹을 신은 위에 치마를 입어요. 오늘은 햇볕이 강하니까 모자를 쓰는 게 좋아요. 안에 들어갈 때 신발을 벗나요? ― 아니요, 신은 채로 괜찮아요. 추우니까 장갑이랑 목도리를 하는 게 좋아요. 늘 안경을 쓰고 있나요? ― 아니요, 집에서는 벗어요. 지금은 콘택트렌즈를 끼고 있어요. 사쿠라 씨는 귀걸이를 하나요? ― 네, 가끔요. 寒いからセーターを着ます。 / 暑いからセーターを脱ぎました。 寒い日は、ストッキングをはいた上にスカートをはきます。 今日は日差しが強いから、帽子をかぶったほうがいいですよ。 中に入る時、靴を脱ぎますか。 ― いえ、はいたままで結構です。 寒いから手袋やマフラーをしたほうがいいですよ。 いつも眼鏡をかけているんですか。 ― いえ、家でははずします。 今はコンタクト（レンズ）をつけています。 さくらさんはイヤリングをつけますか。 ― ええ、ときどき。"}, {"id": 28, "ja": "〜ている", "ko": "~하고 있다 / ~해 있다", "en": "~te iru", "g": 3, "t": false, "d": "형태는 익숙해 보이지만, 다른 상태를 나타내기도 합니다.", "n": 33, "np": 8, "kw": "아직 비가 오고 있어요. 지금 사쿠라 백화점에서 세일을 하고 있어요. 목욕물이 데워졌으니 들어가는 게 어때? 친구한테 듣고 알고 있어요. 거기서 뭘 하고 있어요? / 거기서 뭐 해? 무슨 일을 하세요? / 직업이 뭐예요? 영어 교사를 하고 있어요. / 영어 교사예요. 아, 전철이 오고 있어. 서둘러! まだ雨が降っています。 今、さくらデパートでセールをしています。 お風呂がわいているから、入ったら？ 友達に聞いて、知っています。 そこで何をしているんですか。 / そこで何をしてるの？ お仕事は何をしているんですか。 / お仕事は何ですか。 英語の教師をしています。 / 英語の教師です。 あ、電車が来ている。急いで。"}, {"id": 29, "ja": "〜てから・〜た後・〜たら", "ko": "~하고 나서 / ~한 후에 / ~하면", "en": "~te kara / ~ta ato / ~tara", "g": 3, "t": false, "d": "동사의 て형과 た형에는 여러 가지 쓰임이 있습니다.", "n": 30, "np": 8, "kw": "ATM에 들렀다가 갈게요. 샤워를 하고 나서 나갈게요. 접수를 하고 나서 들어오세요. 잘 생각하고 나서 신청하는 게 좋아요. 이건 식후에 드세요. 전화를 끊은 후에 생각났어요. 물건을 받은 후에 결제를 한다고 해요. 집에 도착하면 메일해 줘. ATMに寄ってから行きます。 シャワーを浴びてから出かけます。 受付をしてからお入りください。 よく考えてから申し込んだほうがいいですよ。 これは食事のあとに飲んでください。 電話を切ったあと、思い出しました。 品物を受け取ったあと、支払いをするそうです。 家に着いたらメールして。"}, {"id": 30, "ja": "〜てしまう・〜ちゃう", "ko": "~해 버리다 / ~해 버렸다", "en": "~te shimau / ~chau", "g": 3, "t": false, "d": "일본어에서는 문형만으로 감정을 나타낼 수 있습니다. 감정을 표현하는 특별한 말이 따로 필요 없어요.", "n": 31, "np": 8, "kw": "어? 벌써 다 마셔 버렸어? 남기면 아까우니까 전부 먹어 버립시다. 그럼 예약해 버려도 될까요? 그런 일, 그만둬 버리면 어때? 죄송해요, 깜빡 잊어버렸어요. 서두르지 않으면 마감에 늦어 버려요. 뭐! 그 얘기를 그녀한테 말해 버렸어? 그 말을 듣고 그녀가 화내 버렸어요. あれ？もう全部飲んじゃったの？ 残すともったいないから、全部食べてしまいましょう。 じゃ、予約しちゃっていいですか。 そんな仕事、やめてしまえば？ すみません、うっかり忘れてしまったんです。 急がないと、締め切りに遅れてしまいます。 えっ！？あのこと、彼女に言っちゃったの！？ それを聞いて、彼女、怒っちゃったんです。"}, {"id": 31, "ja": "〜たまま・〜っぱなし", "ko": "~한 채로 / ~해 놓은 채", "en": "~ta mama / ~ppanashi", "g": 3, "t": false, "d": "이런 표현을 쓰면 일본어를 훨씬 잘하는 사람처럼 들립니다.", "n": 29, "np": 8, "kw": "슬리퍼를 신은 채로 다다미방에 들어가면 안 됩니다. 쓴 채로 두지 말고 정리해 주세요. 잘 모르는 채로 참가했어요. 그는 아무 말도 하지 않은 채 돌아가 버렸어요. 타이밍이 맞지 않아서 결국 아버지와는 만나지 못했어요. 거기는 그대로 놔 두세요. 물이 계속 틀어져 있어요. 어? 창문이 열려 있네. スリッパをはいたまま畳の部屋に入ってはいけません。 使ったままにしないで、片づけてください。 よくわからないまま、参加しました。 彼は何も言わないまま、帰ってしまいました。 タイミングが合わず、結局、父とは会えないままでした。 そこは、そのままにしておいてください。 水が出しっぱなしですよ。 あれ？窓が開けっぱなしになっている。"}, {"id": 32, "ja": "〜ながら・〜し", "ko": "~하면서 / ~하고 ~하니까", "en": "~nagara / ~shi", "g": 3, "t": false, "d": "두 가지 이상의 동작이나 이유를 말하는 방법을 배웁니다.", "n": 28, "np": 8, "kw": "늘 음악을 들으면서 공부해요. 누워서 책을 읽으면 금방 졸려요. 오른쪽으로 돌리면서 당기세요. 스마트폰을 보면서 걸으면 위험해요. 회사를 경영하면서 그림도 그리고 있어요. 역에서 가깝고 그리 비싸지도 않으니 이 호텔로 괜찮을 것 같아요. 바쁘고 돈도 없으니 이번에는 안 갈래요. 매일 아침 달리고 토요일에도 헬스장에 가니까 운동 부족은 아닐 거예요. いつも音楽を聴きながら勉強します。 寝ながら本を読むと、すぐ眠くなります。 右に回しながら、引いてください。 スマホを見ながら歩くと危ないですよ。 会社を経営しながら、絵もかいているんです。 駅から近いし、そんなに高くないし、このホテルでいいと思います。 忙しいし、お金もないから、今回は行きません。 毎朝走ってるし、土曜日もジムに行ってるから、運動不足ではないはずです。"}, {"id": 33, "ja": "〜てもいい・〜ないでください・〜てはいけません", "ko": "허가와 금지", "en": "~te mo ii / ~naide kudasai / ~te wa ikemasen", "g": 3, "t": true, "d": "허락하는 법과 허락하지 않는 법을 배웁니다.", "n": 28, "np": 8, "kw": "안에 들어가도 되나요? ― 아니요, 여기에는 들어가면 안 됩니다. 여기서 점심을 먹어도 되나요? ― 네, 괜찮아요. 늦게 가도 되나요? ― 아니요, 늦으면 못 들어가요. 사전 빌려도 돼? ― 잠깐만. 지금 쓰고 있어서. 이건 깨끗하니까 씻지 않아도 돼요. 답은 오늘이 아니어도 돼요. 내일이면 돼요. 그렇게 걱정하지 마세요. 방해가 되니까 여기에 두지 마세요. 中に入ってもいいですか。 ― いえ、ここに入ってはいけません。 ここでお昼を食べてもいいですか。 ― いいですよ。 遅れて行ってもいいですか。 ― いえ、遅れたら、入れませんよ。 辞書、借りてもいい？ ― ちょっと待って。今使ってるから。 これはきれいだから、洗わなくてもいいです。 返事は今日でなくてもいいです。明日でいいですよ。 そんなに心配しないでください。 邪魔になるから、ここに置かないでください。"}, {"id": 34, "ja": "〜たことがあります", "ko": "~한 적이 있습니다", "en": "~ta koto ga arimasu", "g": 3, "t": true, "d": "일본에 살면 이 문형으로 묻고 대답할 일이 자주 있습니다.", "n": 31, "np": 8, "kw": "교토는 가 본 적이 있지만, 나라는 아직 없어요. 후지산에 올라 본 적이 있나요? 네, 한 번 있어요. 아니요, 아직 한 번도 없어요. 언젠가 올라 보고 싶어요. 기모노를 입어 본 적이 있나요? 그와 이야기해 본 적이 있나요? 아쉽지만 그와는 아직 한 번도 이야기해 본 적이 없어요. 그런 이야기는 들어 본 적이 없어요. 京都は行ったことがありますが、奈良はまだありません。 富士山に登ったことがありますか。 はい、一度あります。 いえ、まだ一度もありません。いつか登ってみたいと思います。 着物を着たことがありますか。 彼と話したことがありますか。 残念ですが、彼とはまだ一度も話したことがないんです。 そんな話、聞いたことがありません。"}, {"id": 35, "ja": "可能表現", "ko": "가능 표현", "en": "Potential, perceptual, sensual", "g": 3, "t": true, "d": "동사의 가능형으로 할 수 있는 일과 할 수 없는 일을 말해 보세요.", "n": 33, "np": 9, "kw": "이건 날로 먹을 수 있나요? 티켓은 어디서 살 수 있나요? 동물원까지 걸어서 갈 수 있나요? 영어를 할 수 있나요? 영어로 쓸 수 있나요? 영어를 알아듣나요? 이 호텔에서 후지산이 보이나요? (전화로) 죄송해요, 잘 안 들리는데요. 지브리 미술관이 어디에 있는지 아세요? ― 아니요, 몰라요. これは生で食べられますか。 チケットはどこで買えますか。 動物園まで歩いて行けますか。 英語が話せますか。 英語で書くことができますか。 英語がわかりますか。 このホテルから富士山が見えますか。 （電話で）すみません、よく聞こえないんですが。 ジブリ美術館がどこにあるか、知っていますか。 ― いえ、知りません。"}, {"id": 36, "ja": "疑問詞", "ko": "의문사", "en": "Interrogatives", "g": 3, "t": true, "d": "육하원칙 같은 의문사가 일본어에도 있습니다.", "n": 33, "np": 8, "kw": "어디로 여행을 갈까요? 후쿠오카는 어떤 도시예요? 축제는 며칠부터 며칠까지예요? 뭐가 재미있어요? 곤란하네. 어떻게 하죠? 어느 것이 제일 싸요? 언제로 할지 정해 주세요. 뭐든 괜찮아요. / 누구든 괜찮아요. / 어디든 괜찮아요. / 언제든 괜찮아요. どこに旅行に行きましょう(か)。 福岡は、どんな街ですか。 お祭りは何日から何日までですか。 何が面白いですか。 困ったなあ。どうしましょう。 どれが一番安いですか。 いつにするか決めてください。 何でもいいです。 / 誰でもいいです。 / どこでもいいです。 / いつでもいいです。"}, {"id": 37, "ja": "〜ておきます・〜てあります・〜ています", "ko": "준비와 상태 (~ておく・~てある)", "en": "~te okimasu / ~te arimasu / ~te imasu", "g": 3, "t": false, "d": "이 표현들에 담긴 일본어의 마음가짐에 주목해 보세요.", "n": 32, "np": 8, "kw": "파티 준비를 해 놓으세요. 가게는 이미 예약해 놓았어요. 그럼 그녀에게도 물어봐 둘게요. 맥주는 사 놓았나요? 음료를 시원하게 해 둡시다. 여기 뭔가 놓여 있는데, 이게 뭐야? 이미 모두 모여 있어요. 요리는 이미 다 됐으니 언제든 시작할 수 있어요. パーティーの準備をしておいてください。 店はもう予約してあります。 じゃ、彼女にも聞いておきますね。 ビールは買ってありますか。 飲み物を冷やしておきましょう。 ここに何か置いてあるけど、これ何？ もうみんな集まっています。 料理はもうできているから、いつでも始められます。"}, {"id": 38, "ja": "〜（よ）う（と思う）・〜たいと思う", "ko": "~하려고 생각하다", "en": "~yo (to omou) / ~tai to omou", "g": 3, "t": false, "d": "「〜よう」「〜う」는 의지와 의도를 나타내고, 「〜たい」는 바람이나 희망을 나타냅니다.", "n": 29, "np": 9, "kw": "좋아, 다음엔 열심히 하자. 배우겠다는 마음이 중요합니다. 다음 달에 교토에 가려고 생각하고 있어요. 여름에 3주 정도 귀국하려고 생각하고 있어요. 장래에는 시골 쪽에 살려고 생각하고 있어요. 대학에 진학할지 말지 고민하고 있어요. 다음 달에 교토에 가고 싶다고 생각하고 있어요. 장래에 통역사가 되고 싶어서 열심히 공부하고 있어요. 사려고 했더니 지갑이 없다는 걸 알아차렸어요. よし、次はがんばろう。 学ぼうという気持ちが大切です。 来月、京都へ行こうと思っています。 夏に3週間ほど帰国しようと思っています。 将来は田舎のほうに住もうと思っています。 大学に進学しようかどうか迷っています。 来月、京都へ行きたいと思っています。 将来、通訳になりたいと思って、頑張って勉強しています。 買おうとしたら、財布がないことに気づいたんです。"}, {"id": 39, "ja": "条件表現", "ko": "조건 표현", "en": "Conditional expressions", "g": 3, "t": false, "d": "이 표현으로 자신의 의도를 말하고, 접속 조사로 상황을 설명할 수 있습니다. 각각의 특징과 쓰임에 주의하세요.", "n": 31, "np": 9, "kw": "저 모퉁이를 돌면 피자 가게가 있어요. 3명이라면 들어갈 수 있겠죠. 붐비면 다른 가게로 할까요? 조금 기다리면 자리가 날 거예요. 조금만 더 일찍 갔으면 그 가게에 들어갈 수 있었을 텐데! 봄이 되면 벚꽃이 피나요? 교토에 가신다면 료칸은 '후지야'가 좋아요. 이 약을 드시면 많이 편해질 거예요. 약을 먹고 바로 잤더니 나았어요. あの角を曲がると、ピザ屋があります。 3人なら入れるでしょう。 混んでいたら、別の店にしますか。 少し待てば、空きますよ。 もうちょっと早く行けば、あの店に入れたのに！ 春になると、桜が咲きますか。 京都に行くなら、旅館は「ふじ屋」がいいですよ。 この薬を飲めば、だいぶ楽になりますよ。 薬を飲んですぐ寝たら、治りました。"}, {"id": 40, "ja": "〜て・〜ので・〜から（理由）", "ko": "이유 표현", "en": "~te / ~node / ~kara [Reasons]", "g": 3, "t": false, "d": "이유를 나타내는 조사는 의미와 쓰임이 다양합니다.", "n": 29, "np": 8, "kw": "인터넷에 연결이 안 돼서 곤란해요. 어제는 피곤해서 바로 자 버렸어요. 붐벼서 안에 들어가지 못했어요. 배가 고파서 죽을 것 같아요. 바빠서 못 갈 것 같아요. 아까우니까 버리지 마세요. 시간이 없어서 이번에는 포기할게요. 볼일이 있어서 오늘은 이만 돌아갈게요. ネットにつながらなくて、困っています。 昨日は疲れて、すぐ寝てしまいました。 混んでいて、中に入れませんでした。 おなかが空いて、死にそうです。 忙しいから行けないと思います。 もったいないから捨てないでください。 時間がないので、今回はあきらめます。 用事があるので、今日はもう帰ります。"}, {"id": 41, "ja": "あげる・くれる・もらう", "ko": "주고받기 (あげる・くれる・もらう)", "en": "ageru / kureru / morau", "g": 3, "t": false, "d": "주고받는 동사는 누가 누구에게 주느냐에 따라 달라집니다. 확실히 구분해 두세요.", "n": 29, "np": 8, "kw": "다나카 씨에게 호주 기념품을 드렸어요. 그는 좀처럼 연락을 주지 않아요. 다나카 씨는 자주 저에게 과자를 줘요. 오늘 중으로 답을 받고 싶은데요. 밀러 씨는 야마다 씨의 서류를 영어로 번역해 주었다고 해요. 형이 마중을 와 주었어요. 전화번호를 알려 주지 않을래요? 친구가 이사를 도와주었어요. 田中さんにオーストラリアのお土産をあげました。 彼はなかなか連絡をくれません。 田中さんはよく、私にお菓子をくれます。 今日中に返事をもらいたいんですが。 ミラーさんは、山田さんの書類を英語に翻訳してあげたそうです。 兄が迎えに来てくれました。 電話番号を教えてくれませんか。 友達に引っ越しを手伝ってもらいました。"}, {"id": 42, "ja": "〜のに", "ko": "~인데도 / ~할 텐데", "en": "~noni", "g": 3, "t": false, "d": "기대나 예상과 다른 결과에 대해 불만이나 아쉬움을 나타내는 표현입니다.", "n": 30, "np": 8, "kw": "바쁜데 괜찮으세요? 거기는 싼데도 맛있어요. 오늘은 평일인데도 붐비네요. 그녀는 알면서도 가르쳐 주지 않아요. 지난번에 만났는데도 이름이 생각나지 않아요. 아까 말했는데! 안 듣고 있었어? 아, 열심히 했는데. 아쉽다. (옷이 더럽혀져서) 너무해! 이거 새 건데! 忙しいのに、大丈夫ですか。 そこは安いのにおいしいんです。 今日は平日なのに込んでいますね。 彼女、知っているのに、教えてくれないんです。 この前会ったのに、名前が思い出せないんです。 さっき言ったのに！聞いてなかったの？ あーあ、頑張ったのに。残念。 （服を汚されて）ひどい！これ、新品なのに！"}, {"id": 43, "ja": "〜らしい・〜みたい・〜っぽい", "ko": "~인 것 같다 / ~답다 / ~스럽다", "en": "~rashii / ~mitai / ~ppoi", "g": 3, "t": false, "d": "비슷하지만 미묘하게 다른 표현들입니다. 차이를 잘 이해하세요.", "n": 28, "np": 8, "kw": "곧 태풍이 온다고 하네요. 어, 방금 그 사람 사장님이었어? 전혀 사장님답지 않은 사람이네. 감기에 걸린 것 같아요. 목이 아파요. 그녀, 화난 것 같았어요. 일본 사람 같다는 말을 자주 들어요. 학생처럼 보이지만 그는 회사 사장이에요. 그는 농담처럼 말했지만 사실은 힘들었을 거예요. 이 거무스름한 옷을 입고 있는 사람이 빌 씨예요. もうすぐ台風が来るらしいですね。 えっ、今の人、社長(さん)だったの？全然社長らしくない人だね。 風邪を引いたみたいです。のどが痛いです。 彼女、怒っているみたいでしたよ。 日本人みたいだってよく言われます。 学生っぽく見えるけど、彼は会社の社長なんです。 彼、冗談っぽく言ってましたけど、本当は辛かったはずです。 この黒っぽい服を着ているのがビルさんです。"}, {"id": 44, "ja": "〜そうです・〜って（伝聞）", "ko": "~라고 한다 (전언)", "en": "~sō / ~tte [hearsay]", "g": 3, "t": false, "d": "전해 들은 이야기를 말할 때의 정중함의 차이에 주의하세요.", "n": 30, "np": 8, "kw": "지금 시기에 교토는 덥대요. 스미스 씨는 내일 쉰다고 했어요. 스미스 씨, 내일 쉰대. 그 사람, 내일 안 온대. 빌 씨는 시드니 출신이라고 해요. 빌 씨는 시드니 출신이래요. 밀러 씨는 학생이 아니라고 해요. 밀러 씨는 학생이 아니래. 今の時期、京都は暑いそうですね。 スミスさんは、明日休むって言ってました。 スミスさん、明日休むんだって。 彼、明日来ないんだって。 ビルさんは、シドニーの出身だそうですよ。 ビルさんは、シドニーの出身なんですって。 ミラーさんは、学生じゃないそうです。 ミラーさんは、学生じゃないんだって。"}, {"id": 45, "ja": "〜そう（様態）", "ko": "~해 보인다 (양태)", "en": "~sō [mode]", "g": 3, "t": false, "d": "「そう」로 상태를 나타낼 수 있다면 일본어가 꽤 자연스럽게 들립니다.", "n": 33, "np": 8, "kw": "잘 될 것 같나요? 추워서 얼어 죽을 것 같았어요. 오늘은 붐벼 보이네요. 잊어버릴 것 같아서 적어 둘게요. 어때? 할 수 있을 것 같아? 저 케이크 맛있어 보여. 변함없이 그는 바빠 보여요. 그 사람, 별로 기뻐 보이지 않았어. / 기쁘지 않은 것 같았어. うまくいきそうですか。 寒くて凍えそうでした。 今日は混んでそうですね。 忘れそうだから、書いておきます。 どう？できそう？ あのケーキ、おいしそう。 相変わらず、彼は忙しそうです。 彼、あんまりうれしそうじゃなかったね。 / うれしくなさそうだったね。"}, {"id": 46, "ja": "〜ようになる・〜くなる・〜になる", "ko": "변화 표현", "en": "~yō ni naru / ~ku naru / ~ni naru", "g": 3, "t": false, "d": "변화를 나타내는 법을 배우면 일본어 실력과 일본 문화에 대해 이야기할 수 있게 됩니다.", "n": 31, "np": 8, "kw": "요즘 갑자기 추워졌네요. 짐이 가벼워졌어! 머리가 꽤 길어졌어요. 조금 헷갈리게 됐어요(잘 모르겠어요). 점심을 먹은 뒤에는 어쩔 수 없이 졸려요. 재미있는 사람이네요. 친구가 되고 싶어요. 큰 병에 걸린 적은 없어요. 점점 일본어를 말할 수 있게 되었어요. 最近、急に寒くなりましたね。 荷物が軽くなった！ 髪がだいぶ長くなりました。 ちょっとわからなくなりました。 お昼ご飯を食べたあとは、どうしても眠くなります。 面白い人ですね。友達になりたいです。 大きな病気になったことはありません。 だんだん日本語が話せるようになってきました。"}, {"id": 47, "ja": "受け身・使役", "ko": "수동·사역", "en": "Passive / Causative", "g": 3, "t": false, "d": "수동형은 일본어의 독특한 특징 중 하나입니다. 어렵지만 도전해 볼 가치가 있어요!", "n": 30, "np": 8, "kw": "이 건물은 약 천 년 전에 지어졌다고 해요. 아까 전철 안에서 발을 밟혔어요. 여기를 지나가지 말라는 말을 들었어요. 그녀가 나를 싫어하는 건 아닌지 걱정돼요. 꼭 제가 하게 해 주세요. 놀라게 하지 마세요. 날짜가 정해지면 바로 알려 주세요. 그녀를 실망시키고 말았어요. この建物は、約千年前に建てられたそうです。 さっき電車の中で足を踏まれました。 ここを通らないように言われました。 彼女に嫌われていないか心配です。 ぜひ、私にやらせてください。 びっくりさせないでください。 日にちが決まったら、すぐに知らせてください。 彼女をがっかりさせてしまいました。"}, {"id": 48, "ja": "敬語", "ko": "경어", "en": "Honorific expressions", "g": 3, "t": true, "d": "일본어로 공손하게 말할 수 있으면 높은 평가를 받습니다.", "n": 33, "np": 9, "kw": "몇 시에 돌아오세요? 점심은 어떻게 하시겠어요? 안내해 드리겠습니다. 이쪽으로 오세요. 메일 잘 보았습니다. 가방을 들어 드리겠습니다. 이제 어디로 가시나요? 선생님 댁에 찾아뵙겠습니다. 어서 오세요. 들어오세요. 어서 드세요. ― 네, 그럼 잘 먹겠습니다. 何時にお戻りですか。 ご昼食はどうなさいますか。 ご案内します。どうぞ、こちらへ。 メール拝見しました。 かばんをお持ちします。 これから、どちらへいらっしゃいますか。 先生のお宅に伺います。 いらっしゃい。どうぞお上がりください。 どうぞお召し上がりください。 ― はい。では、いただきます。"}, {"id": 49, "ja": "電車に乗る", "ko": "전철 타기", "en": "Catching a train", "g": 4, "t": true, "d": "놀랄지도 모르지만, 일본의 대도시에서는 전철이 자동차보다 편리하고 꼭 필요한 교통수단입니다.", "n": 30, "np": 8, "kw": "실례합니다, 시부야에는 어떻게 가면 되나요? 긴자선 시부야행을 타세요. 이 전철은 아키하바라에 서나요? 이 전철은 도쿄에 가나요? 어디서 갈아타나요? 신주쿠에서 주오선으로 갈아타세요. 도쿄행(전철)은 몇 번 선(승강장)인가요? 이 전철은 급행인가요, 각 역 정차인가요? すみません、渋谷にはどう行けばいいですか。 銀座線の渋谷行きに乗ってください。 この電車は秋葉原に止まりますか。 この電車は東京に行きますか。 どこで乗り換えますか。 新宿で中央線に乗り換えてください。 東京行き（の電車）は何番線ですか。 / 何番ホームですか。 この電車は急行ですか、各駅（停車）ですか。"}, {"id": 50, "ja": "バス・タクシーを使う", "ko": "버스·택시 이용하기", "en": "Catching a bus or a taxi", "g": 4, "t": true, "d": "버스와 택시도 시내를 돌아다닐 때 편리합니다.", "n": 30, "np": 8, "kw": "버스 정류장은 어디인가요? 후지대학행 버스는 몇 번 승차장인가요? 시청에 가려면 어디서 내리면 되나요? 요금은 언제 내나요? 탈 때인가요, 내릴 때인가요? 정리권을 뽑고 내릴 때 내세요. 이 길로 곧장 가세요. 다음 모퉁이에서 오른쪽으로 도세요. 이 근처에서 세워 주세요. バス停はどこですか。 富士大学行きのバスは何番乗り場ですか。 市役所に行くには、どこで降りればいいですか。 お金はいつ払いますか。乗るときですか、降りるときですか。 整理券を取って、降りる時に払ってください。 この道をまっすぐ行ってください。 次の角を右に曲がってください。 この辺で止めてください。"}, {"id": 51, "ja": "道をたずねる", "ko": "길 묻기", "en": "Asking the way", "g": 4, "t": true, "d": "이 표현들을 익히면 길을 잃어도 걱정 없습니다.", "n": 30, "np": 8, "kw": "실례합니다, 역은 어느 쪽인가요? 이 근처에 편의점이 없나요? 모토마치 2초메 3번은 어디쯤인가요? 택시 승차장은 어디인가요? 실례합니다, 여기에 가고 싶은데요. 금각사에는 어떻게 가면 되나요? 여기서 기요미즈데라까지 걸어서 갈 수 있나요? 스카이트리의 가장 가까운 역은 어디인가요? すみません、駅はどっちですか。 この近くにコンビニはありませんか。 本町2丁目3番はどの辺ですか。 タクシー乗り場はどこですか。 すみません、ここに行きたいんですが。 金閣寺へはどう行けばいいですか。 ここから清水寺まで歩いて行けますか。 スカイツリーの最寄り駅はどこですか。"}, {"id": 52, "ja": "ホテルで", "ko": "호텔에서", "en": "At a hotel", "g": 4, "t": true, "d": "대부분의 호텔에서는 영어로도 통하지만, 일본어를 쓰면 더 좋습니다.", "n": 33, "np": 8, "kw": "예약한 브라운입니다. 체크인 부탁합니다. 저녁 식사는 몇 시부터인가요? 인터넷은 사용할 수 있나요? 뜨거운 물이 안 나오는데요. 유카타가 작은데요. 더 큰 사이즈는 있나요? 모닝콜을 부탁하고 싶은데요. 택시를 불러 주셨으면 하는데요. 짐을 맡아 주실 수 있나요? 予約しているブラウンです。チェックインをお願いします。 夕食は何時からですか。 インターネットは使えますか。 お湯が出ないんですが。 浴衣が小さいんですが。大きいサイズのはありますか。 モーニングコールをお願いしたいんですが。 タクシーを呼んでほしいんですが。 荷物を預かってもらえますか。"}, {"id": 53, "ja": "レストラン・喫茶店で①", "ko": "식당·카페에서 ①", "en": "At a restaurant or coffee shop ①", "g": 4, "t": true, "d": "식당과 카페에서 의사소통하는 법을 익혀 보세요.", "n": 30, "np": 7, "kw": "메뉴 좀 보여 주실 수 있나요? 저기요, 주문 부탁합니다. 커피 부탁합니다. 따뜻한 것과 아이스 중 어느 쪽으로 하시겠어요? 따뜻한 걸로 부탁합니다. 음료는 식사 후에 드려도 괜찮으신가요? 나중에 부탁합니다. / 같이 부탁합니다. メニューを見せてもらえますか。 すみません、注文をお願いします。 コーヒーをお願いします。 ホットとアイス、どちらになさいますか。 ホットでお願いします。 お飲み物はお食事の後でよろしいですか。 後でお願いします。 / 一緒でお願いします。"}, {"id": 54, "ja": "レストラン・喫茶店で②", "ko": "식당·카페에서 ②", "en": "At a restaurant or coffee shop ②", "g": 4, "t": true, "d": "식당이나 카페에서 모임이나 파티를 하는 일이 흔합니다. 여러분도 초대받게 될 거예요!", "n": 33, "np": 8, "kw": "저는 이걸로 할게요. 사쿠라 씨는 뭘로 하시겠어요? 추천 메뉴는 뭔가요? 이건 돼지고기가 들어 있나요? 날생선은 잘 못 먹어요. 술은 못 마셔요. 주문한 것이 안 나오는데요. 이건 주문하지 않았어요. 계산 부탁합니다. 私はこれにします。さくらさんは何にしますか。 おすすめは何ですか。 これは豚肉が入っていますか。 生の魚は苦手なんです。 お酒は飲めないんです。 注文したものが来ないんですが。 これは注文していません。 お会計お願いします。"}, {"id": 55, "ja": "デパートで①", "ko": "백화점에서 ①", "en": "At a department store ①", "g": 4, "t": true, "d": "백화점에서 쇼핑할 때 쓰면 유용한 표현입니다.", "n": 33, "np": 8, "kw": "이건 얼마예요? 조금 더 싼 건 없나요? 다른 색상은 있나요? 조금 더 밝은 색은 없나요? 입어 봐도 될까요? / 입어 볼 수 있나요? 이 신발 신어 봐도 될까요? 이거 M 사이즈 있나요? 이거 25센티 있나요? これはいくらですか。 もうちょっと安いのはありませんか。 ほかの色はありますか。 もう少し明るい色はありませんか。 試着してもいいですか。 / 試着できますか。 このくつ、はいてみてもいいですか。 これのMはありますか。 これの25センチはありますか。"}, {"id": 56, "ja": "デパートで②", "ko": "백화점에서 ②", "en": "At a department store ②", "g": 4, "t": true, "d": "백화점 직원은 매우 정중하고 친절하다고들 합니다. 대화를 즐겨 보세요.", "n": 33, "np": 8, "kw": "죄송합니다. 여기 진열된 것이 전부입니다. 주문해서 가져와야 하는데, 어떻게 하시겠어요? ― 그럼 부탁합니다. 이 바지는 너무 꽉 껴요. 알겠습니다. 그럼 이걸로 할게요. 좀 생각해 볼게요. 계산은 어떻게 하시겠어요? 카드로 괜찮나요? / 현금으로 부탁합니다. 선물이라서 포장해 주실 수 있나요? 申し訳ありません。こちらに出ているだけとなっております。 お取り寄せになりますが、いかがなさいますか。 ― じゃ、お願いします。 このズボンはきつすぎます。 わかりました。じゃ、これにします。 ちょっと考えます。 お支払いはどうなさいますか。 カードでいいですか。 / 現金でお願いします。 プレゼントなので、包んでもらえますか。"}, {"id": 57, "ja": "スーパー・コンビニで", "ko": "슈퍼·편의점에서", "en": "At a supermarket or convenience store", "g": 4, "t": true, "d": "일본의 편의점은 정말 편리합니다. 다양한 상품과 서비스를 제공합니다.", "n": 30, "np": 8, "kw": "실례합니다, 올리브유는 어디에 있나요? 이건 언제까지 먹을 수 있나요? 개봉하고 나서 얼마나 가나요? 냉장고에서 1주일은 괜찮습니다. 비닐봉투에 넣어 드릴까요? ― 아니요, 괜찮습니다. ABC 슈퍼 카드를 갖고 계신가요? 이건 데워 드릴까요? ― 네, 부탁합니다. 택배를 보내고 싶은데요. すみません、オリーブオイルはどこですか。 これはいつまで食べられますか。 開けてからどれくらいもちますか。 冷蔵庫で1週間は大丈夫です。 レジ袋にお入れしますか。 ― いえ、結構です。 ABCスーパーのカードはお持ちですか。 こちらは温めますか。 ― お願いします。 宅配便を送りたいんですが。"}, {"id": 58, "ja": "家電量販店などで", "ko": "전자제품 매장 등에서", "en": "At a shop such as an electronics store", "g": 4, "t": true, "d": "일본에서는 흥정이 흔하지 않지만, 가전제품은 가끔 가격 협상이 가능합니다. 이 표현들을 써 보세요!", "n": 31, "np": 8, "kw": "이거랑 이거는 어디가 달라요? 조금 오래돼도 괜찮으니 싼 쪽이 좋아요. 조금 더 싸게 안 될까요? 7만 엔이라면 사겠는데요. 보증 기간은 어느 정도인가요? 집까지 보내 주실 수 있나요? / 배송해 주실 수 있나요? 언제 도착하나요? 이거 불량품이었어요. 교환해 주실 수 있나요? これとこれは、どこが違うんですか。 少し古くてもいいので、安いほうがいいです。 もう少し安くなりませんか。 7万円だったら買うんですが。 保証期間はどのくらいですか。 自宅まで送ってもらえますか。 / 配送してもらえますか。 いつ、届きますか。 これ、不良品だったんです。交換してもらえますか。"}, {"id": 59, "ja": "薬局で", "ko": "약국에서", "en": "At a drug store", "g": 4, "t": true, "d": "감기 기운이 조금만 있어도 약국에 가면 됩니다.", "n": 30, "np": 8, "kw": "이 약은 언제 먹나요? / 이 약은 언제 먹으면 되나요? 아침·점심·저녁, 하루 3번 식후에 드세요. 흰 약이 2알, 파란 캡슐이 1알입니다. 배가 아파요. 좋은 약이 있나요? 진통제를 원하는데요. 빨리 듣는 게 좋아요. 꽃가루 알레르기에 듣는 좋은 약은 없나요? 이 약은 먹으면 졸린가요? この薬はいつ飲みますか。 / この薬はいつ飲めばいいですか。 朝・昼・晩、一日3回、食後に飲んでください。 白いお薬が2錠、青いカプセルが1錠です。 お腹が痛いんです。いい薬はありますか。 痛み止めの薬がほしいんですが。 早く効くのがいいです。 花粉症に効くいい薬はありませんか。 この薬は、飲むと眠くなりますか。"}, {"id": 60, "ja": "病院で", "ko": "병원에서", "en": "At a hospital", "g": 4, "t": true, "d": "증상을 잘 설명하면 더 좋은 치료를 받을 수 있습니다.", "n": 33, "np": 9, "kw": "오늘은 진료를 하나요? 몇 시까지인가요? 지금 건강보험증이 없는데, 진료받을 수 있나요? 어떻게 오셨어요?(어디가 불편하세요?) 어제부터 오한이 나요. 두통이 있어요. / 머리가 아파요. 구역질이 나요. 속이 안 좋아요(기분이 안 좋아요). 가끔 어지러워요. 식욕은 어때요? ― 별로 없어요. 今日は診察はしていますか。何時までですか。 今、保険証を持っていないんですが、受診できますか。 どうされましたか。 昨日から寒気がするんです。 頭痛がします。 / 頭が痛いです。 吐き気がします。 気分が悪いです。 ときどきめまいがします。 食欲はどうですか。 ― あまりありません。"}, {"id": 61, "ja": "郵便局・銀行・役所で①", "ko": "우체국·은행·관공서에서 ①", "en": "At a post office, bank or government office ①", "g": 4, "t": true, "d": "일본에 살면 자주 가게 되는 곳입니다.", "n": 31, "np": 8, "kw": "이 짐을 항공편으로 시드니까지 보내고 싶은데요. 이걸 EMS로 싱가포르까지 보내고 싶은데요. 항공편이면 며칠 정도 걸리나요? 90엔 우표 5장 주세요. 이걸 속달로 부탁합니다. 등기로 해 주세요. 계좌를 열고 싶은데요. 월세를 자동이체로 하고 싶은데요. この荷物を航空便でシドニーまで送りたいんですが。 これをEMSでシンガポールまで送りたいんですが。 航空便だと何日くらいかかりますか。 90円切手を5枚ください。 これを速達でお願いします。 書留にしてください。 口座を開きたいんですが。 家賃を自動引き落としにしたいのですが。"}, {"id": 62, "ja": "郵便局・銀行・役所で②", "ko": "우체국·은행·관공서에서 ②", "en": "At a post office, bank or government office ②", "g": 4, "t": false, "d": "동네 시청(구청)에서 정보를 얻으면 저렴하거나 무료인 일본어 수업이나 다양한 행사에 참여할 수 있습니다.", "n": 31, "np": 8, "kw": "지금 1달러에 얼마예요? / 지금 1달러가 몇 엔이에요? ATM 사용법을 알려 주세요. ATM으로 송금할 수 있나요? 재류카드를 갱신하고 싶은데요. 이 서류에 기입해 주세요. 작성 방법을 잘 모르겠는데요. 영어로 상담할 수 있나요? 일본어 강좌는 있나요? 今、1ドルいくらですか。 / 今、1ドル何円ですか。 ATMの使い方を教えてください。 ATMで振り込みができますか。 在留カードの更新をしたいのですが。 この書類にご記入ください。 書き方がよくわからないのですが。 英語で相談できますか。 日本語の講座はありますか。"}, {"id": 63, "ja": "大学で①", "ko": "대학에서 ①", "en": "At a university", "g": 4, "t": false, "d": "유학생으로 일본에 와서 공부해 보세요!", "n": 27, "np": 7, "kw": "이 수업은 누구나 들을 수 있나요? 이 강좌를 듣고 싶은데요. 수강 신청 접수는 언제까지인가요? 리포트 제출 기한은 언제인가요? 리포트를 봐 주셔도 괜찮을까요? 모레 3시에 선생님 연구실로 찾아뵙겠습니다. 지도해 주셔서 감사합니다. この授業は誰でも受けられますか。 この講座を受けたいんですが。 履修登録の受付はいつまでですか。 レポートの提出期限はいつですか。 レポートを見ていただいてもよろしいでしょうか。 明後日3時に先生の研究室にうかがいます。 ご指導いただき、ありがとうございました。"}, {"id": 64, "ja": "大学で②", "ko": "대학에서 ②", "en": "At a university", "g": 4, "t": false, "d": "윗사람에게는 정중하게 말해야 하지만, 동료와는 조금 덜 격식 있게 말해 보세요.", "n": 28, "np": 8, "kw": "이제 수업 들으러 가는 거예요? 내일 2교시에 수업 있어요? 이 강좌는 아직 등록할 수 있는 것 같아요. 오늘 '국제 커뮤니케이션'은 휴강이에요. 학점은 딸 수 있을 것 같아요? ― 음, 놓칠지도 몰라요. 모리 선생님은 엄격해서 수업을 빠질 수 없어요. 이거 잠깐 복사하게 해 주지 않을래요? 수잔은 도서관에서 자료를 조사하고 있어요. これから授業に出るんですか。 明日の2限は授業入ってますか。 この講座はまだ登録できるみたいですよ。 今日の「国際コミュニケーション」は休講です。 単位は取れそうですか。 ― うーん、落とすかもしれません。 森先生は厳しいから、授業は休めません。 これ、ちょっとコピーさせてくれませんか。 スーザンは図書館で調べものをしています。"}, {"id": 65, "ja": "会社で①", "ko": "회사에서 ①", "en": "At the office ①", "g": 4, "t": false, "d": "사무실 환경에서만 쓰는 말과 표현입니다. 익혀 두면 직장 생활이 편해집니다.", "n": 30, "np": 7, "kw": "수고하십니다. 오후부터 외출합니다. 몇 시에 돌아올 예정인가요? 이걸 5부씩 복사해 주실 수 있나요? ― 알겠습니다. 그럼 점심 먹으러 다녀오겠습니다. 사쿠라 광고에 미팅하러 다녀오겠습니다. 먼저 가보겠습니다. ― 수고하셨습니다. お疲れさまです。 午後から外出します。 何時に戻る予定ですか。 これを5部ずつコピーしてもらえますか。 ― わかりました。 じゃ、お昼に行ってきます。 さくら広告に打ち合わせに行ってきます。 お先に失礼します。 ― お疲れさまでした。"}, {"id": 66, "ja": "会社で②", "ko": "회사에서 ②", "en": "At the office ②", "g": 4, "t": false, "d": "의사소통을 잘하면 직장에서 좋은 결과가 따라옵니다.", "n": 27, "np": 7, "kw": "브라운 씨도 회의에 참석하나요? 미팅은 10시부터였나요? 부장님이 미팅을 3시로 변경했으면 하신대요. 다나카 씨는 사내에 있나요? 담당자 명함을 갖고 있나요? 특별한 문제는 없나요? ― 네, 지금으로서는 문제없어요. 잠깐 여쭙고 싶은 게 있는데, 지금 괜찮으세요? ブラウンさんも会議に出るんですか。 ミーティングは10時からでしたか。 部長が打ち合わせを3時に変更してほしいそうです。 田中さんは社内にいますか。 担当者の名刺を持っていますか。 特に問題はないですか。 ― ええ。今のところ、問題ないです。 ちょっとお聞きしたいことがあるんですが、今、いいですか。"}, {"id": 67, "ja": "友達・先生の家を訪ねる", "ko": "친구·선생님 집 방문하기", "en": "Visiting a friend's or teacher's house", "g": 4, "t": false, "d": "처음 남의 집을 방문하면 조금 긴장됩니다. 이 표현들이 나와 집주인을 편안하게 해 줄 거예요.", "n": 32, "np": 8, "kw": "안녕하세요. 실례하겠습니다. 다나카 씨에게는 늘 신세를 지고 있습니다. 커피나 홍차는 어떠세요? 그럼 커피로 부탁합니다. 뭘 마실래요? ― 그럼 차로 부탁합니다. 오늘 초대해 주셔서 감사했습니다. 그럼 슬슬 가보겠습니다. 방해했습니다(잘 있다 갑니다). こんにちは。おじゃまします。 田中さんには、いつもお世話になっています。 コーヒーか紅茶はいかがですか。 じゃ、コーヒーをお願いします。 何を飲みますか。 ― じゃ、お茶をお願いします。 今日はお招きいただき、ありがとうございました。 では、そろそろ失礼します。 どうもおじゃましました。"}, {"id": 68, "ja": "ホストファミリーと", "ko": "호스트 패밀리와", "en": "With a host family", "g": 4, "t": false, "d": "일본인 호스트 패밀리와 지내는 것은 평생 남는 추억이 됩니다. 기회가 있다면 꼭 잡으세요.", "n": 28, "np": 8, "kw": "앞으로 신세 지겠습니다, 존스입니다. 잘 부탁드립니다. 여러분은 보통 몇 시에 일어나세요? 저녁 식사는 보통 몇 시쯤인가요? 집안 규칙이 있으면 알려 주세요. (사진을 보면서) 이 사람은 누구예요? 오늘은 좀 늦게 돌아올 거예요. 걱정을 끼쳐 죄송했습니다. 진짜 가족처럼 대해 주셔서 감사했습니다. これからお世話になります、ジョーンズです。よろしくお願いします。 皆さんはいつも何時に起きますか。 晩ご飯はいつも何時頃ですか。 何か家のルールがあったら教えてください。 （写真を見ながら）この人は誰ですか。 今日はちょっと帰りが遅くなります。 心配をかけて、すみませんでした。 本当の家族のように接してくれて、ありがとうございました。"}, {"id": 69, "ja": "不動産屋で", "ko": "부동산 중개소에서", "en": "At a real estate agent", "g": 4, "t": false, "d": "몇 년간 살 곳이니 타협하지 말고 원하는 것을 요구하세요.", "n": 33, "np": 8, "kw": "이 근처에서 혼자 살 방을 찾고 있는데요. 어떤 방을 찾으세요? 어떤 방을 원하세요? 밝고 넓은 방이 좋아요. 조용한 곳이 좋아요. 역에서 가까운 쪽이 좋아요. 역에서 도보 10분 이내인 곳이 좋아요. 이 방을 보고 싶은데요. この辺で、一人暮らしの部屋を探しているんですが。 どんな部屋をお探しですか。 どんな部屋をご希望ですか。 明るくて、広い部屋がいいです。 静かなところのほうがいいです。 駅から近いほうがいいです。 駅から徒歩10分以内のところがいいです。 この部屋を見てみたいんですが。"}, {"id": 70, "ja": "近所の人と話す", "ko": "이웃과 이야기하기", "en": "Talking with neighbors", "g": 4, "t": false, "d": "일본에는 '먼 친척보다 가까운 이웃'이라는 속담이 있습니다. 이웃과 잘 지내는 것이 중요합니다.", "n": 27, "np": 7, "kw": "201호로 이사 온 리베라라고 합니다. 잘 부탁드립니다. 타는 쓰레기는 무슨 요일에 내놓나요? 타지 않는 쓰레기는 무슨 요일에 내놓나요? 병이나 캔은 어디에 내놓으면 되나요? 페트병은 재활용 쓰레기인가요? 가구나 전자제품 같은 쓰레기는 어떻게 버리나요? 화장실이 막혀 버린 것 같아요. 201号室に引っ越してきました、リベラと申します。よろしくお願いします。 燃えるごみは何曜日に出すんですか。 燃えないごみは何曜日に出すんですか。 びんや缶はどこに出したらいいですか。 ペットボトルは資源ごみですか。 家具や電気製品のようなごみは、どうやって捨てるんですか。 トイレが詰まってしまったようです。"}, {"id": 71, "ja": "電話で話す①～友達・先生と", "ko": "전화 통화 ① ~ 친구·선생님과", "en": "Talking on the phone ① with friends or teachers", "g": 4, "t": false, "d": "친구와 전화로 소통할 때 필요한 표현을 익혀 보세요.", "n": 33, "np": 9, "kw": "네, 리베라입니다. 여보세요, 리베라 씨? 다나카인데요. 실례지만 어느 다나카 씨시죠? 실례지만 번호를 잘못 거신 건 아닐까요? 리베라라고 하는데요, 스즈키 선생님 댁에 계신가요? 밤늦게 죄송합니다. 지금 시간 괜찮으세요? / 지금 시간 괜찮아? 그럼 또 연락할게. (전화를 끊을 때) 그럼 끊겠습니다. / 그럼 실례하겠습니다. はい、リベラです。 もしもし、リベラさん？田中ですが。 失礼ですが、どちらの田中さんですか。 失礼ですが、番号をお間違えではないでしょうか。 リベラと申しますが、鈴木先生はご在宅でしょうか。 夜分に申し訳ありません。 今、お時間よろしいですか。 / 今、時間、大丈夫？ じゃ、また連絡するね。 （電話を切るとき）じゃ、失礼します。 / では、失礼いたします。"}, {"id": 72, "ja": "電話で話す②～職場で", "ko": "전화 통화 ② ~ 직장에서", "en": "Talking on the phone ② at the workplace", "g": 4, "t": false, "d": "같은 전화 통화라도 사무실에서 쓰는 말은 친구와 통화할 때와 다릅니다.", "n": 26, "np": 7, "kw": "다나카 씨 부탁합니다. ― (알겠습니다.) 잠시만 기다려 주세요. 영업부 다나카 씨에게 연결해 주실 수 있을까요? 연결해 드릴 테니 이대로 기다려 주세요. 죄송합니다. 다나카는 지금 다른 전화를 받고 있는데요… 다나카는 지금 자리를 비웠는데, 돌아오면 전화 드리게 할까요? 다나카는 지금 회의 중인데, 급하신가요? 괜찮으시다면 메시지를 받아 둘 수 있는데요… 田中さんをお願いします。 ― （かしこまりました。）少々お待ちください。 営業部の田中さんにお取り次ぎいただけますでしょうか。 おつなぎしますので、このままでお待ちください。 申し訳ありません。田中はただ今ほかの電話に出ておりますが…。 田中はただ今席をはずしておりますが、折り返しお電話させましょうか。 田中はただ今会議中ですが、お急ぎでしょうか。 よろしければ、ご伝言を承りますが…。"}, {"id": 73, "ja": "電話で話す③～職場で", "ko": "전화 통화 ③ ~ 직장에서", "en": "Talking on the phone ③ at the workplace", "g": 4, "t": false, "d": "사무실, 특히 고객과 전화할 때는 경어가 필수입니다.", "n": 27, "np": 7, "kw": "다나카는 지금 외출 중이며, 3시에 돌아올 예정입니다. 몇 시쯤 돌아오시나요? 돌아오시면 전화를 주셨으면 하는데요… 죄송합니다, 전화를 주셨다고 해서요… (문의에 대해) 확인해 보겠습니다. 잠시만 기다려 주세요. 담당자에게 바꿔 드릴 테니 잠시만 기다려 주세요. 죄송합니다, 한 번 더 말씀해 주시겠어요? 田中はただ今外出しておりまして、3時に戻る予定です。 何時ごろにお戻りでしょうか。 お戻りになったらお電話をいただきたいのですが…。 すみません、お電話をいただいたそうで…。 （問い合わせに）お調べしますので、少々お待ちください。 担当の者に代わりますので、少々お待ちください。 すみません、もう一度よろしいですか。"}, {"id": 74, "ja": "電話で話す④～宅配などの注文", "ko": "전화 통화 ④ ~ 주문·택배", "en": "Talking on the phone ④         <span class="go">학습하기 →</span>
      </a>`;
  });
  if(!shown) cards='<div class="card soon"><div class="ko">검색 결과가 없어요</div></div>';
  $('#grid').innerHTML=cards;
  $('#prog').innerHTML=`<span>학습 진도 ${done} / ${IDX.length}</span><div class="bar"><i style="width:${done/IDX.length*100}%"></i></div>`;
  $('#sum').textContent = tot?`누적 최고 점수 ${fmt(got)} / ${tot}점 (${Math.round(got/tot*100)}%)`:'';
}
