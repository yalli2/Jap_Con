<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 50, "ja": "バス・タクシーを使う", "ko": "버스·택시 이용하기", "en": "Catching a bus or a taxi", "part": "Part 4 · 장면편", "travel": true, "theory": "<h2>학습 포인트<\/h2><p>버스와 택시도 시내를 돌아다닐 때 편리합니다.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>일본의 택시는 보통 뒷좌석에 탑니다(앞좌석을 써야 할 만큼 승객이 많을 때는 예외). 뒷좌석 승객 쪽 문은 기사님이 열고 닫으니 직접 열거나 닫지 마세요. 손가락으로 가리키며 의사소통할 수 있는 카드를 갖춘 택시도 많습니다. 버스 요금은 보통 앞쪽에서 내며, 탈 때 내는 노선과 내릴 때 내는 노선이 있습니다. 뒷문으로 타면 대개 내릴 때 앞문에서 요금을 냅니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 8개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"バスていはどこですか。\" title=\"눌러서 듣기\"><ruby>バス停<rt>バスてい<\/rt><\/ruby>はどこですか。<\/span><span class=\"rom\">Basutei wa doko desu ka.<\/span><\/div><\/div><div class=\"kor\">버스 정류장은 어디인가요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ふじだいがく行きのバスはなんばんのりばですか。\" title=\"눌러서 듣기\"><ruby>富士大学<rt>ふじだいがく<\/rt><\/ruby><ruby>行<rt>い<\/rt><\/ruby>きのバスは<ruby>何番乗<rt>なんばんの<\/rt><\/ruby>り<ruby>場<rt>ば<\/rt><\/ruby>ですか。<\/span><span class=\"rom\">Fujidaigaku iki no basu wa nanbannoriba desu ka.<\/span><\/div><\/div><div class=\"kor\">후지대학행 버스는 몇 번 승차장인가요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"しやくしょに行くには、どこで降りればいいですか。\" title=\"눌러서 듣기\"><ruby>市役所<rt>しやくしょ<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>くには、どこで<ruby>降<rt>お<\/rt><\/ruby>りればいいですか。<\/span><span class=\"rom\">Shiyakusho ni iku ni wa, doko de orireba ii desu ka.<\/span><\/div><\/div><div class=\"kor\">시청에 가려면 어디서 내리면 되나요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お金はいつはらいますか。乗るときですか、降りるときですか。\" title=\"눌러서 듣기\">お<ruby>金<rt>かね<\/rt><\/ruby>はいつ<ruby>払<rt>はら<\/rt><\/ruby>いますか。<ruby>乗<rt>の<\/rt><\/ruby>るときですか、<ruby>降<rt>お<\/rt><\/ruby>りるときですか。<\/span><span class=\"rom\">Okane wa itsu haraimasu ka. Noru toki desu ka, oriru toki desu ka.<\/span><\/div><\/div><div class=\"kor\">요금은 언제 내나요? 탈 때인가요, 내릴 때인가요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">5<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"せいりけんを取って、降りる時に払ってください。\" title=\"눌러서 듣기\"><ruby>整理券<rt>せいりけん<\/rt><\/ruby>を<ruby>取<rt>と<\/rt><\/ruby>って、<ruby>降<rt>お<\/rt><\/ruby>りる<ruby>時<rt>とき<\/rt><\/ruby>に<ruby>払<rt>はら<\/rt><\/ruby>ってください。<\/span><span class=\"rom\">Seiriken o totte, oriru toki ni haratte kudasai.<\/span><\/div><\/div><div class=\"kor\">정리권을 뽑고 내릴 때 내세요.<\/div><div class=\"ptip\">💡 整理券은 탄 정류장을 알려 주는 번호표입니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">6<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この道をまっすぐ行ってください。\" title=\"눌러서 듣기\">この<ruby>道<rt>みち<\/rt><\/ruby>をまっすぐ<ruby>行<rt>い<\/rt><\/ruby>ってください。<\/span><span class=\"rom\">Kono michi o massugu itte kudasai.<\/span><\/div><\/div><div class=\"kor\">이 길로 곧장 가세요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">7<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"次のかどを右に曲がってください。\" title=\"눌러서 듣기\"><ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>角<rt>かど<\/rt><\/ruby>を<ruby>右<rt>みぎ<\/rt><\/ruby>に<ruby>曲<rt>ま<\/rt><\/ruby>がってください。<\/span><span class=\"rom\">Tsugi no kado o migi ni magatte kudasai.<\/span><\/div><\/div><div class=\"kor\">다음 모퉁이에서 오른쪽으로 도세요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">8<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" r
