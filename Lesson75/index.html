<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 75, "ja": "電話で話す⑤～チケットの予約", "ko": "전화 통화 ⑤ ~ 티켓 예약", "en": "Talking on the phone ⑤ booking tickets", "part": "Part 4 · 장면편", "travel": true, "theory": "<h2>학습 포인트<\/h2><p>예약하려면 시간, 좌석, 인원 등 원하는 조건을 말하는 표현을 익혀야 합니다.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>전화로 예약하려면 「〜の予約をしたいんですが」로 시작하면 원하는 바가 분명해집니다. 그다음 수령·결제 방법 등 몇 가지 질문에 대답하게 됩니다. 공연 티켓은 &#x27;S석&#x27;, &#x27;SS석&#x27;이 가장 비싸고 시야가 가장 좋으며, &#x27;A석&#x27;은 더 저렴합니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 7개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"チケットの予約をしたいのですが。\" title=\"눌러서 듣기\">チケットの<ruby>予約<rt>よやく<\/rt><\/ruby>をしたいのですが。<\/span><span class=\"rom\">Chiketto no yoyaku o shitai no desu ga.<\/span><\/div><\/div><div class=\"kor\">티켓을 예약하고 싶은데요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"エービーシーのライブですが、じゅうにがつはつかのチケットはまだ取れますか。\" title=\"눌러서 듣기\">ABCのライブですが、<ruby>12月20日<rt>じゅうにがつはつか<\/rt><\/ruby>のチケットはまだ<ruby>取<rt>と<\/rt><\/ruby>れますか。<\/span><span class=\"rom\">Ēbīshī no raibu desu ga, jūnigatsuhatsuka no chiketto wa mada toremasu ka.<\/span><\/div><\/div><div class=\"kor\">ABC 라이브인데요, 12월 20일 티켓은 아직 구할 수 있나요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"エス席はまだ残っていますか。\" title=\"눌러서 듣기\">S<ruby>席<rt>せき<\/rt><\/ruby>はまだ<ruby>残<rt>のこ<\/rt><\/ruby>っていますか。<\/span><span class=\"rom\">S seki wa mada nokotte imasu ka.<\/span><\/div><\/div><div class=\"kor\">S석은 아직 남아 있나요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"じゃ、エー席をに枚お願いします。\" title=\"눌러서 듣기\">じゃ、A<ruby>席<rt>せき<\/rt><\/ruby>を2<ruby>枚<rt>まい<\/rt><\/ruby>お<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Ja, āru seki o ni mai onegai shimasu.<\/span><\/div><\/div><div class=\"kor\">그럼 A석 2장 부탁합니다.<\/div><div class=\"ptip\">💡 티켓·종이는 「〜枚」로 셉니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">5<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"なるべく前の方の席がいいのですが。\" title=\"눌러서 듣기\">なるべく<ruby>前<rt>まえ<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>の<ruby>席<rt>せき<\/rt><\/ruby>がいいのですが。<\/span><span class=\"rom\">Narubeku mae no hō no seki ga ii no desu ga.<\/span><\/div><\/div><div class=\"kor\">되도록 앞쪽 좌석이 좋은데요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">6<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"先日予約したチケットのキャンセルをお願いしたいのですが。\" title=\"눌러서 듣기\"><ruby>先日<rt>せんじつ<\/rt><\/ruby><ruby>予約<rt>よやく<\/rt><\/ruby>したチケットのキャンセルをお<ruby>願<rt>ねが<\/rt><\/ruby>いしたいのですが。<\/span><span class=\"rom\">Senjitsu yoyaku shita chiketto no kyanseru o onegai shitai no desu ga.<\/span><\/div><\/div><div class=\"kor\">일전에 예약한 티켓을 취소하고 싶은데요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">7<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"予約番号がわからなくなってしまったのですが。\" title=\"눌러서 듣기\"><ruby>予約<rt>よやく<\/rt><\/ruby><ruby>番号<rt>ばんごう<\/rt><\/ruby>がわからなくなってしまったのですが…。<\/span><span class=\"rom\">Yoyaku bangō ga wakaranaku natte shimatta no desu ga...<\/span><\/div><\/div><div class=\"kor\">예약 번호를 잃어버려서 모르게 됐는데요…<\/div><\/div><\/li><\/ol>", "ex": [{"title": "① 뜻 고르기 (일본어 → 한국어)", "short": "① 뜻 고르기", "instr": "일본어 표현을 읽고 알맞은 우리말 뜻을 고르세요. 표현을 누르면 소리를 들을 수 있어요.", "rule": "표현의 뜻을 소리 내어 읽으며 다시 확인해 보세요.", "items": [{"t": "pick", "q": "<div class=\"jq\"><div class=\"alt\
