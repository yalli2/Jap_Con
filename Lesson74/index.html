<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 74, "ja": "電話で話す④～宅配などの注文", "ko": "전화 통화 ④ ~ 주문·택배", "en": "Talking on the phone ④ ordering delivery", "part": "Part 4 · 장면편", "travel": true, "theory": "<h2>학습 포인트<\/h2><p>예시 대화로 배달을 주문하고 조정할 때 유용한 표현을 익혀 보세요.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>일본의 택배 시스템은 매우 정교합니다. 스키 장비를 미리 호텔로 보내거나, 여행 가방을 공항으로 보내거나, 시내에 선물을 보낼 수도 있습니다. 집에서 수거해 가고, 가까운 편의점이나 제휴 가게에 가져가도 됩니다. 배달 때 집에 없으면 &#x27;부재 안내표&#x27;를 남기고, 원하는 때에 무료로 재배달해 줍니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 8개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"注文をお願いします。\" title=\"눌러서 듣기\"><ruby>注文<rt>ちゅうもん<\/rt><\/ruby>をお<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Chūmon o onegai shimasu.<\/span><\/div><\/div><div class=\"kor\">주문 부탁합니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"それでは、お客様のお名前とご住所をお願いします。\" title=\"눌러서 듣기\">それでは、お<ruby>客様<rt>きゃくさま<\/rt><\/ruby>のお<ruby>名前<rt>なまえ<\/rt><\/ruby>とご<ruby>住所<rt>じゅうしょ<\/rt><\/ruby>をお<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Sore de wa, okyakusama no onamae to gojūsho o onegai shimasu.<\/span><\/div><\/div><div class=\"kor\">그럼 고객님의 성함과 주소를 말씀해 주세요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"では、ご注文を承ります。\" title=\"눌러서 듣기\">では、ご<ruby>注文<rt>ちゅうもん<\/rt><\/ruby>を<ruby>承<rt>うけたまわ<\/rt><\/ruby>ります。<\/span><span class=\"rom\">De wa, gochūmon o uketamawarimasu.<\/span><\/div><\/div><div class=\"kor\">그럼 주문을 받겠습니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class=\"alt\"><div class
