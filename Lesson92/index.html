<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 92, "ja": "必須フレーズ70", "ko": "필수 표현 70", "en": "Basic phrases 70", "part": "부록 · 필수 표현 70", "travel": true, "theory": "<h2>학습 포인트<\/h2><p>교재 맨 끝에 정리된 &#x27;꼭 알아야 할 필수 표현 70개&#x27;입니다. 여행 전에 이것만이라도 소리 내어 익혀 두세요.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>각 표현 옆에 교재 쪽수와 해당 과로 이동하는 링크가 있습니다. 헷갈리는 표현은 해당 과로 돌아가 설명과 연습문제를 다시 풀어 보세요.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 70개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あついですね。\" title=\"눌러서 듣기\"><ruby>暑<rt>あつ<\/rt><\/ruby>いですね。<\/span><span class=\"rom\">Atsui desu ne.<\/span><\/div><\/div><div class=\"kor\">덥네요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson88/\">교재 199쪽 · 88과 天気에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あのう、ちょっとしつもんがあるんですが。\" title=\"눌러서 듣기\">あのう、ちょっと<ruby>質問<rt>しつもん<\/rt><\/ruby>があるんですが。<\/span><span class=\"rom\">Anō, chotto shitsumon ga aru n desu ga.<\/span><\/div><\/div><div class=\"kor\">저기, 잠깐 질문이 있는데요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson22/\">교재 63쪽 · 22과 ある・いる에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"危ないからきをつけてください。\" title=\"눌러서 듣기\"><ruby>危<rt>あぶ<\/rt><\/ruby>ないから<ruby>気<rt>き<\/rt><\/ruby>をつけてください。<\/span><span class=\"rom\">Abunai kara kiotsukete kudasai.<\/span><\/div><\/div><div class=\"kor\">위험하니 조심하세요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson25/\">교재 69쪽 · 25과 〜てください・〜ないでください에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div .<\/span><\/div><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お疲れさまでした。\" title=\"눌러서 듣기\">お<ruby>疲<rt>つか<\/rt><\/ruby>れさまでした。<\/span><span class=\"rom\">Otsukaresama deshita.<\/span><\/div><\/div><div class=\"kor\">먼저 가보겠습니다.<br>― 수고하셨습니다.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson65/\">교재 151쪽 · 65과 会社で①에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">13<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おしごとは何をしているんですか。\" title=\"눌러서 듣기\">お<ruby>仕事<rt>しごと<\/rt><\/ruby>は<ruby>何<rt>なん<\/rt><\/ruby>をしているんですか。<\/span><span class=\"rom\">Oshigoto wa nan o shite iru n desu ka.<\/span><\/div><\/div><div class=\"kor\">무슨 일을 하세요?<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson28/\">교재 75쪽 · 28과 〜ている에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">14<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おおつかれさまです。\" title=\"눌러서 듣기\">お<ruby>疲<rt>おつか<\/rt><\/ruby>れさまです。<\/span><span class=\"rom\">Ootsukare sama desu.<\/span><\/div><\/div><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お疲れさま。\" title=\"눌러서 듣기\">お<ruby>疲<rt>つか<\/rt><\/ruby>れさま。<\/span><span class=\"rom\">Otsukaresama.<\/span><\/div><\/div><div class=\"kor\">수고하십니다. / 수고해.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson4/\">교재 25쪽 · 4과 あいさつをする에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">15<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おねがいします。\" title=\"눌러서 듣기\">お<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Onegaishimasu.<\/span><\/div><\/div><div class=\"kor\">부탁합니다.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson2/\">교재 19쪽 · 2과 生活에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">16<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おはようございます。\" title=\"눌러서 듣기\">おはようございます。<\/span><span class=\"rom\">Ohayō gozaimasu.<\/span><\/div><\/div><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おはよう。\" title=\"눌러서 듣기\">おはよう。<\/span><span class=\"rom\">Ohayō.<\/span><\/div><\/div><div class=\"kor\">안녕하세요(아침). / 좋은 아침.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson1/\">교재 17쪽 · 1과 あいさつ에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">17<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"がんばってください。\" title=\"눌러서 듣기\">がんばってください。<\/span><span class=\"rom\">Ganbatte kudasai.<\/span><\/div><\/div><div class=\"kor\">힘내세요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson14/\">교재 45쪽 · 14과 励ます에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">18<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"きぶんが悪いです。\" title=\"눌러서 듣기\"><ruby>気分<rt>きぶん<\/rt><\/ruby>が<ruby>悪<rt>わる<\/rt><\/ruby>いです。<\/span><span class=\"rom\">Kibun ga warui desu.<\/span><\/div><\/div><div class=\"kor\">속이 안 좋아요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson60/\">교재 141쪽 · 60과 病院で에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">19<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はあついですね。\" title=\"눌러서 듣기\"><ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>暑<rt>あつ<\/rt><\/ruby>いですね。<\/span><span class=\"rom\">Kyō wa atsui desu ne.<\/span><\/div><\/div><div class=\"kor\">오늘은 덥네요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson21/\">교재 61쪽 · 21과 形容詞에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">20<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"コーヒーをお願いします。\" title=\"눌러서 듣기\">コーヒーをお<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Kōhī o onegai shimasu.<\/span><\/div><\/div><div class=\"kor\">커피 부탁합니다.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson53/\">교재 127쪽 · 53과 レストラン・喫茶店で①에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">21<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"こちらはあたためますか。\" title=\"눌러서 듣기\">こちらは<ruby>温<rt>あたた<\/rt><\/ruby>めますか。<\/span><span class=\"rom\">Kochira wa atatamemasu ka.<\/span><\/div><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"お願いします。\" title=\"눌러서 듣기\">お<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Onegai shimasu.<\/span><\/div><\/div><div class=\"kor\">이건 데워 드릴까요?<br>― 네, 부탁합니다.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson57/\">교재 135쪽 · 57과 スーパー・コンビニで에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">22<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この近くにコンビニはありませんか。\" title=\"눌러서 듣기\">この<ruby>近<rt>ちか<\/rt><\/ruby>くにコンビニはありませんか。<\/span><span class=\"rom\">Kono chikaku ni konbini wa arimasen ka.<\/span><\/div><\/div><div class=\"kor\">이 근처에 편의점이 없나요?<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson51/\">교재 123쪽 · 51과 道をたずねる에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">23<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この人はだれですか。\" title=\"눌러서 듣기\">この<ruby>人<rt>ひと<\/rt><\/ruby>は<ruby>誰<rt>だれ<\/rt><\/ruby>ですか。<\/span><span class=\"rom\">Kono hito wa dare desu ka.<\/span><\/div><\/div><div class=\"kor\">이 사람은 누구예요?<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson68/\">교재 157쪽 · 68과 ホストファミリーと에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">24<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"このへんで止めてください。\" title=\"눌러서 듣기\">この<ruby>辺<rt>へん<\/rt><\/ruby>で<ruby>止<rt>と<\/rt><\/ruby>めてください。<\/span><span class=\"rom\">Kono hen de tomete kudasai.<\/span><\/div><\/div><div class=\"kor\">이 근처에서 세워 주세요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson50/\">교재 121쪽 · 50과 バス・タクシーを使う에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">25<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ごめんなさい。\" title=\"눌러서 듣기\">ごめんなさい。<\/span><span class=\"rom\">Gomen nasai.<\/span><\/div><\/div><div class=\"kor\">미안해요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson6/\">교재 29쪽 · 6과 お礼を言う・謝る에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">26<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"これはいくらですか。\" title=\"눌러서 듣기\">これはいくらですか。<\/span><span class=\"rom\">Kore wa ikura desu ka.<\/span><\/div><\/div><div class=\"kor\">이건 얼마예요?<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson55/\">교재 131쪽 · 55과 デパートで①에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">27<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"こんにちは。\" title=\"눌러서 듣기\">こんにちは。<\/span><span class=\"rom\">Konnichiha.<\/span><\/div><\/div><div class=\"kor\">안녕하세요(낮).<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson1/\">교재 17쪽 · 1과 あいさつ에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">28<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"こんにちは、おじゃまします。\" title=\"눌러서 듣기\">こんにちは、お or\">실례합니다, 여기에 가고 싶은데요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson51/\">교재 123쪽 · 51과 道をたずねる에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">41<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"すみません、ちゅうもんをお願いします。\" title=\"눌러서 듣기\">すみません、<ruby>注文<rt>ちゅうもん<\/rt><\/ruby>をお<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Sumimasen, chūmon o onegai shimasu.<\/span><\/div><\/div><div class=\"kor\">저기요, 주문 부탁합니다.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson53/\">교재 127쪽 · 53과 レストラン・喫茶店で①에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">42<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"すみませんが、その日はちょっと…。\" title=\"눌러서 듣기\">すみませんが、その<ruby>日<rt>ひ<\/rt><\/ruby>はちょっと…。<\/span><span class=\"rom\">Sumimasen ga, sono hi wa chotto...<\/span><\/div><\/div><div class=\"kor\">죄송하지만 그날은 좀…<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson9/\">교재 35쪽 · 9과 誘いを受ける・断る에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">43<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ぜひ、私にやらせてください。\" title=\"눌러서 듣기\">ぜひ、<ruby>私<rt>わたし<\/rt><\/ruby>にやらせてください。<\/span><span class=\"rom\">Zehi, watashi ni yarasete kudasai.<\/span><\/div><\/div><div class=\"kor\">꼭 제가 하게 해 주세요.<\/div><div class=\"ptip\"><a class=\"plink\" href=\"../Lesson47/\">교재 113쪽 · 47과 受け身・使役에서 자세히 →<\/a><\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">44<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"そんなにしんぱいしないでください。\" title=\"눌러서 듣기\">そんなに<ruby>心配<rt>しんぱい<\/rt><\/ruby>しないでください。<\/span><span class=\"rom\">Sonna ni shinpai shinaide kudasai.<\/span><\/div><\/div><div class=\"kor\">그렇게 걱정하지 마세요.<\/div><div class=\"p
