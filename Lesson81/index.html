<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 81, "ja": "アルバイトの面接", "ko": "아르바이트 면접", "en": "Part time job interview", "part": "Part 4 · 장면편", "travel": false, "theory": "<h2>학습 포인트<\/h2><p>면접에서는 예의 바른 태도와 알맞은 말씨가 필요합니다.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>「お時間をさいていただき、ありがとうございました」는 직장에서 아주 흔한 표현입니다. 면접이나 미팅을 요청한 쪽이 상대가 내어 준 시간에 감사할 때 씁니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 8개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"インターネットのぼしゅうこうこくを見て、お電話しました。\" title=\"눌러서 듣기\">インターネットの<ruby>募集広告<rt>ぼしゅうこうこく<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>て、お<ruby>電話<rt>でんわ<\/rt><\/ruby>しました。<\/span><span class=\"rom\">Intānetto no boshūkōkoku o mite, odenwa shimashita.<\/span><\/div><\/div><div class=\"kor\">인터넷 모집 광고를 보고 전화 드렸습니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"まだぼしゅうをされていますか。\" title=\"눌러서 듣기\">まだ<ruby>募集<rt>ぼしゅう<\/rt><\/ruby>をされていますか。<\/span><span class=\"rom\">Mada boshū o sarete imasu ka.<\/span><\/div><\/div><div class=\"kor\">아직 모집하고 계신가요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"では、明日さんじにおうかがいします。よろしくお願いいたします。\" title=\"눌러서 듣기\">では、<ruby>明日<rt>あす<\/rt><\/ruby><ruby>3時<rt>さんじ<\/rt><\/ruby>にお<ruby>伺<rt>うかが<\/rt><\/ruby>いします。よろしくお<ruby>願<rt>ねが<\/rt><\/ruby>いいたします。<\/span><span class=\"rom\">De wa, asu sanji ni ōkagai shimasu. Yoroshiku onegai itashimasu.<\/span><\/div><\/div><div class=\"kor\">그럼 내일 3시에 찾아뵙겠습니다. 잘 부탁드립니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"（受付で）本日さんじに面接のおやくそくをいただいておりますスミスと申します。\" title=\"눌러서 듣기\">（<ruby>受付<rt>うけつけ<\/rt><\/ruby>で）<ruby>本日<rt>ほんじつ<\/rt><\/ruby><ruby>3時<rt>さんじ<\/rt><\/ruby>に<ruby>面接<rt>めんせつ<\/rt><\/ruby>のお<ruby>約束<rt>やくそく<\/rt><\/ruby>をいただいておりますスミスと<ruby>申<rt>もう<\/rt><\/ruby>します。<\/span><span class=\"rom\">(Uketsuke de) honjitsu sanji ni mensetsu no oyakusoku o itadaite orimasu Sumisu to moushimasu.<\/span><\/div><\/div><div class=\"kor\">(접수처에서) 오늘 3시에 면접 약속을 받은 스미스라고 합니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">5<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"（面接官に）スミスと申します。本日はよろしくお願いいたします。\" title=\"눌러서 듣기\">（<ruby>面接官<rt>めんせつかん<\/rt><\/ruby>に）スミスと<ruby>申<rt>もう<\/rt><\/ruby>します。<ruby>本日<rt>ほんじつ<\/rt><\/ruby>はよろしくお<ruby>願<rt>ねが<\/rt><\/ruby>いいたします。<\/span><span class=\"rom\">(Mensetsukan ni) Sumisu to moushimasu. Honjitsu wa yoroshiku onegai itashimasu.<\/span><\/div><\/div><div class=\"kor\">(면접관에게) 스미스라고 합니다. 오늘 잘 부탁드립니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">6<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"こういう仕事は経験ありますか。\" title=\"눌러서 듣기\">こういう<ruby>仕事<rt>しごと<\/rt><\/ruby>は<ruby>経験<rt>けいけん<\/rt><\/ruby>ありますか。<\/span><span class=\"rom\">Kō iu shigoto wa keiken arimasu ka.<\/span><\/div><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"いえ、かんれんした仕事は多少経験があります。\" title=\"눌러서 듣기\">いえ、<ruby>関連<rt>かんれん<\/rt><\/ruby>した<ruby>仕事<rt>しごと<\/rt><\/ruby>は<ruby>多少<rt>たしょう<\/rt><\/ruby><ruby>経験<rt>けいけん<\/rt><\/ruby>があります。<\/span><span class=\"rom\">Ie, kanren shita shigoto wa tashō keiken ga arimasu.<\/span><\/div><\/div><div class=\"kor\">이런 일은 경험이 있나요?<br>― 아니요, 관련된 일은 어느 정도 경험이 있습니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">7<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" dat
