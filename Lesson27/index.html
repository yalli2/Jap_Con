<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 27, "ja": "着脱動詞", "ko": "입고 벗는 동사", "en": "The verb &quot;to wear&quot;", "part": "Part 3 · 문법편", "travel": false, "theory": "<h2>학습 포인트<\/h2><p>일본어에는 왜 &#x27;입다&#x27;를 나타내는 말이 이렇게 많을까요? 여기서 정리합니다.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>&#x27;입다&#x27;라는 동사는 입는 것에 따라 달라집니다. 머리부터 입는 옷은 「着る」, 아래에서부터 입는 신발·바지는 「はく」, 모자는 「かぶる」, 안경은 「かける」, 액세서리는 「する／つける」를 씁니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 8개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"寒いからセーターをきます。\" title=\"눌러서 듣기\"><ruby>寒<rt>さむ<\/rt><\/ruby>いからセーターを<ruby>着<rt>き<\/rt><\/ruby>ます。<\/span><span class=\"rom\">Samui kara sētā o kimasu.<\/span><\/div><\/div><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"暑いからセーターを脱ぎました。\" title=\"눌러서 듣기\"><ruby>暑<rt>あつ<\/rt><\/ruby>いからセーターを<ruby>脱<rt>ぬ<\/rt><\/ruby>ぎました。<\/span><span class=\"rom\">Atsui kara sētā o nugimashita.<\/span><\/div><\/div><div class=\"kor\">추워서 스웨터를 입어요. / 더워서 스웨터를 벗었어요.<\/div><div class=\"ptip\">💡 着る(입다) ↔ 脱ぐ(벗다).<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"寒い日は、ストッキングをはいた上にスカートをはきます。\" title=\"눌러서 듣기\"><ruby>寒<rt>さむ<\/rt><\/ruby>い<ruby>日<rt>ひ<\/rt><\/ruby>は、ストッキングをはいた<ruby>上<rt>うえ<\/rt><\/ruby>にスカートをはきます。<\/span><span class=\"rom\">Samui hi wa, sutokkingu o haita ue ni sukāto o hakimasu.<\/span><\/div><\/div><div class=\"kor\">추운 날은 스타킹을 신은 위에 치마를 입어요.<\/div><div class=\"ptip\">💡 바지·치마·신발·양말은 「はく」를 씁니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"今日はひざしが強いから、帽子をかぶったほうがいいですよ。\"
