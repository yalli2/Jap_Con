<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 49, "ja": "電車に乗る", "ko": "전철 타기", "en": "Catching a train", "part": "Part 4 · 장면편", "travel": true, "theory": "<h2>학습 포인트<\/h2><p>놀랄지도 모르지만, 일본의 대도시에서는 전철이 자동차보다 편리하고 꼭 필요한 교통수단입니다.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>도쿄 주변에는 전철과 노선이 아주 많고 교통 시스템도 훌륭합니다. 전철을 능숙하게 이용하고 싶다면 이 과의 표현을 꼭 익혀 두세요.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 8개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"すみません、しぶやにはどう行けばいいですか。\" title=\"눌러서 듣기\">すみません、<ruby>渋谷<rt>しぶや<\/rt><\/ruby>にはどう<ruby>行<rt>い<\/rt><\/ruby>けばいいですか。<\/span><span class=\"rom\">Sumimasen, shibuya ni wa dō ikeba ii desu ka.<\/span><\/div><\/div><div class=\"kor\">실례합니다, 시부야에는 어떻게 가면 되나요?<\/div><div class=\"ptip\">💡 「どう行けばいいですか」: 어떻게 가면 되나요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"ぎんざせんの渋谷行きに乗ってください。\" title=\"눌러서 듣기\"><ruby>銀座線<rt>ぎんざせん<\/rt><\/ruby>の<ruby>渋谷<rt>しぶや<\/rt><\/ruby><ruby>行<rt>い<\/rt><\/ruby>きに<ruby>乗<rt>の<\/rt><\/ruby>ってください。<\/span><span class=\"rom\">Ginzasen no Shibuya-iki ni notte kudasai.<\/span><\/div><\/div><div class=\"kor\">긴자선 시부야행을 타세요.<\/div><div class=\"ptip\">💡 「〜行き」: ~행.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"この電車はあきはばらに止まりますか。\" title=\"눌러서 듣기\">この<ruby>電車<rt>でんしゃ<\/rt><\/ruby>は<ruby>秋葉原<rt>あきはばら<\/rt><\/ruby>に<ruby>止<rt>と<\/rt><\/ruby>まりますか。<\/span><span class=\"rom\">Kono densha wa akihabara ni tomarimasu ka.<\/span><\/div><\/div><div class=\"kor\">이 전철은 아키하바라에 서나요?<\/div><div class=\"ptip\">💡 止まる: 서다, 멈추다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\
