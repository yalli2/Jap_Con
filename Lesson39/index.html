<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 39, "ja": "条件表現", "ko": "조건 표현", "en": "Conditional expressions", "part": "Part 3 · 문법편", "travel": false, "theory": "<h2>학습 포인트<\/h2><p>이 표현으로 자신의 의도를 말하고, 접속 조사로 상황을 설명할 수 있습니다. 각각의 특징과 쓰임에 주의하세요.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>「X と Y」는 X가 일어나면 Y가 필연적으로 일어난다는 뜻이라, 과학적인 사실, 자연 현상(6번), 개인의 습관에 자주 쓰입니다. 「〜てください」와 「〜たい」는 「と」나 「ば」 뒤에 올 수 없지만, 「たら」에는 이런 제한이 없습니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 9개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"あのかどを曲がると、ピザ屋があります。\" title=\"눌러서 듣기\">あの<ruby>角<rt>かど<\/rt><\/ruby>を<ruby>曲<rt>ま<\/rt><\/ruby>がると、ピザ<ruby>屋<rt>や<\/rt><\/ruby>があります。<\/span><span class=\"rom\">Ano kado o magaru to, pizaya ga arimasu.<\/span><\/div><\/div><div class=\"kor\">저 모퉁이를 돌면 피자 가게가 있어요.<\/div><div class=\"ptip\">💡 「Vと」: ~하면 (반드시).<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"さんにんならはいれるでしょう。\" title=\"눌러서 듣기\"><ruby>3人<rt>さんにん<\/rt><\/ruby>なら<ruby>入<rt>はい<\/rt><\/ruby>れるでしょう。<\/span><span class=\"rom\">Sannin nara haireru deshō.<\/span><\/div><\/div><div class=\"kor\">3명이라면 들어갈 수 있겠죠.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"こんでいたら、別の店にしますか。\" title=\"눌러서 듣기\"><ruby>混<rt>こ<\/rt><\/ruby>んでいたら、<ruby>別<rt>べつ<\/rt><\/ruby>の<ruby>店<rt>みせ<\/rt><\/ruby>にしますか。<\/span><span class=\"rom\">Konde itara, betsu no mise ni shimasu ka.<\/span><\/div><\/div><div class=\"kor\">붐비면 다른 가게로 할까요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"少しまてば、空きますよ。\" title=\"눌러서 듣기\"><ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>待<rt>ま<\/rt><\/ruby>てば、<ruby>空<rt>あ<\/rt><\/ruby>きますよ。<\/span><span class=\"rom\">Sukoshi mateba, akimasu yo.<\/span><\/div><\/div><div class=\"kor\">조금 기다리면 자리가 날 거예요.<\/div><div class=\"ptip\">💡 「〜ば」: ~하면.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">5<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"もうちょっと早く行けば、あの店に入れたのに！\" title=\"눌러서 듣기\">もうちょっと<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>行<rt>い<\/rt><\/ruby>けば、あの<ruby>店<rt>みせ<\/rt><\/ruby>に<ruby>入<rt>い<\/rt><\/ruby>れたのに！<\/span><span class=\"rom\">Mō chotto hayaku ikeba, ano mise ni ireta no ni!<\/span><\/div><\/div><div class=\"kor\">조금만 더 일찍 갔으면 그 가게에 들어갈 수 있었을 텐데!<\/div><div class=\"ptip\">💡 「〜のに」: ~할 텐데 (아쉬움).<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">6<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"春になると、桜が咲きますか。\" title=\"눌러서 듣기\"><ruby>春<rt>はる<\/rt><\/ruby>になると、<ruby>桜<rt>さくら<\/rt><\/ruby>が<ruby>咲<rt>さ<\/rt><\/ruby>きますか。<\/span><span class=\"rom\">Haru ni naru to, sakura ga sakimasu ka.<\/span><\/div><\/div><div class=\"kor\">봄이 되면 벚꽃이 피나요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">7<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"京都に行くなら、旅館は「ふじ屋」がいいですよ。\" title=\"눌러서 듣기\"><ruby>京都<rt>きょうと<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>くなら、<ruby>旅館<rt>りょかん<\/rt><\/ruby>は「ふじ<ruby>屋<rt>や<\/rt><\/ruby>」がいいですよ。<\/span><span class=\"rom\">Kyōto ni iku nara, ryokan wa &quot; Fujiya &quot; ga ii desu yo.<\/span><\/div><\/div><div class=\"kor\">교토에 가신다면 료칸은 &#x27;후지야&#x27;가 좋아요.<\/div><div class=\"ptip\">💡 「Aなら」: A라면.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">8<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"
