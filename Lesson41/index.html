<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 41, "ja": "あげる・くれる・もらう", "ko": "주고받기 (あげる・くれる・もらう)", "en": "ageru / kureru / morau", "part": "Part 3 · 문법편", "travel": false, "theory": "<h2>학습 포인트<\/h2><p>주고받는 동사는 누가 누구에게 주느냐에 따라 달라집니다. 확실히 구분해 두세요.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>「あげる」: 내가 또는 다른 사람이 누군가에게 줄 때 씁니다. (「私にあげる」는 쓰지 않습니다. 주는 사람이 주어입니다.) 「くれる」: 누군가가 나(또는 내 아이, 동생 등)에게 줄 때 씁니다. (주는 사람이 주어.) 「もらう」: 받는 사람이 주어이며, 누군가에게서 받습니다. 다른 동사에 붙이면 그 행동에 대한 고마운 마음이 더해집니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 8개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"田中さんにオーストラリアのお土産をあげました。\" title=\"눌러서 듣기\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんにオーストラリアのお<ruby>土産<rt>みやげ<\/rt><\/ruby>をあげました。<\/span><span class=\"rom\">Tanaka-san ni Ōsutoraria no omiyage o agemashita.<\/span><\/div><\/div><div class=\"kor\">다나카 씨에게 호주 기념품을 드렸어요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"彼はなかなか連絡をくれません。\" title=\"눌러서 듣기\"><ruby>彼<rt>かれ<\/rt><\/ruby>はなかなか<ruby>連絡<rt>れんらく<\/rt><\/ruby>をくれません。<\/span><span class=\"rom\">Kare wa nakanaka renraku o kuremasen.<\/span><\/div><\/div><div class=\"kor\">그는 좀처럼 연락을 주지 않아요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"田中さんはよく、私にお菓子をくれます。\" title=\"눌러서 듣기\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんはよく、<ruby>私<rt>わたし<\/rt><\/ruby>にお<ruby>菓子<rt>かし<\/rt><\/ruby>をくれます。<\/span><span class=\"rom\">Tanaka-san wa yoku, watashi ni okashi o kuremasu.<\/span><\/div><\/div><div class=\"kor\">다나카 씨는 자주 저에게 과자를 줘요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class
