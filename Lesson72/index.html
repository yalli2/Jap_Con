<script>window.TOTAL_LESSONS=92;window.LESSON={"id": 72, "ja": "電話で話す②～職場で", "ko": "전화 통화 ② ~ 직장에서", "en": "Talking on the phone ② at the workplace", "part": "Part 4 · 장면편", "travel": false, "theory": "<h2>학습 포인트<\/h2><p>같은 전화 통화라도 사무실에서 쓰는 말은 친구와 통화할 때와 다릅니다.<\/p><div class=\"note warn\"><b class=\"lab\">원포인트<\/b>회사나 가게에 전화하면 「お待たせしました。〜です。」라는 말을 자주 듣습니다. 건 사람이 오래 기다리지 않았더라도, 받는 쪽에서 기다리게 했다는 점을 인정하는 인사입니다.<\/div><p class=\"tip\">🔊 일본어 표현을 누르면 소리가 나요. 위쪽 버튼으로 후리가나·로마자를 켜고 끌 수 있어요.<\/p><h3>핵심 표현 7개<\/h3><ol class=\"phr\"><li class=\"ph\"><span class=\"pn\">1<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"田中さんをお願いします。\" title=\"눌러서 듣기\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんをお<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/span><span class=\"rom\">Tanaka-san o onegai shimasu.<\/span><\/div><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"（かしこまりました。）しょうしょうお待ちください。\" title=\"눌러서 듣기\">（かしこまりました。）<ruby>少々<rt>しょうしょう<\/rt><\/ruby>お<ruby>待<rt>ま<\/rt><\/ruby>ちください。<\/span><span class=\"rom\">(Kashikomarimashita.) shōshō omachi kudasai.<\/span><\/div><\/div><div class=\"kor\">다나카 씨 부탁합니다.<br>― (알겠습니다.) 잠시만 기다려 주세요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">2<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"えいぎょうぶの田中さんにお取り次ぎいただけますでしょうか。\" title=\"눌러서 듣기\"><ruby>営業部<rt>えいぎょうぶ<\/rt><\/ruby>の<ruby>田中<rt>たなか<\/rt><\/ruby>さんにお<ruby>取<rt>と<\/rt><\/ruby>り<ruby>次<rt>つ<\/rt><\/ruby>ぎいただけますでしょうか。<\/span><span class=\"rom\">Eigyōbu no Tanaka-san ni otoritsugiitadakemasu deshō ka.<\/span><\/div><\/div><div class=\"kor\">영업부 다나카 씨에게 연결해 주실 수 있을까요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">3<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"おつなぎしますので、このままでおまちください。\" title=\"눌러서 듣기\">おつなぎしますので、このままでお<ruby>待<rt>ま<\/rt><\/ruby>ちください。<\/span><span class=\"rom\">Otsunagi shimasu no de, kono mama de omachi kudasai.<\/span><\/div><\/div><div class=\"kor\">연결해 드릴 테니 이대로 기다려 주세요.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">4<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"申し訳ありません。田中はただ今ほかの電話に出ておりますが…。\" title=\"눌러서 듣기\"><ruby>申<rt>もう<\/rt><\/ruby>し<ruby>訳<rt>わけ<\/rt><\/ruby>ありません。<ruby>田中<rt>たなか<\/rt><\/ruby>はただ<ruby>今<rt>いま<\/rt><\/ruby>ほかの<ruby>電話<rt>でんわ<\/rt><\/ruby>に<ruby>出<rt>で<\/rt><\/ruby>ておりますが…。<\/span><span class=\"rom\">Mōshiwake arimasen. Tanaka wa tadaima hoka no denwa ni dete orimasu ga...<\/span><\/div><\/div><div class=\"kor\">죄송합니다. 다나카는 지금 다른 전화를 받고 있는데요…<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">5<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"田中はただ今せきをはずしておりますが、折り返しお電話させましょうか。\" title=\"눌러서 듣기\"><ruby>田中<rt>たなか<\/rt><\/ruby>はただ<ruby>今<rt>いま<\/rt><\/ruby><ruby>席<rt>せき<\/rt><\/ruby>をはずしておりますが、<ruby>折<rt>お<\/rt><\/ruby>り<ruby>返<rt>かえ<\/rt><\/ruby>しお<ruby>電話<rt>でんわ<\/rt><\/ruby>させましょうか。<\/span><span class=\"rom\">Tanaka wa tadaima seki o hazushite orimasu ga, orikaeshi odenwa sasemashō ka.<\/span><\/div><\/div><div class=\"kor\">다나카는 지금 자리를 비웠는데, 돌아오면 전화 드리게 할까요?<\/div><div class=\"ptip\">💡 折り返し는 &#x27;바로 되돌려서&#x27;라는 뜻으로 전화 응대에서 자주 씁니다.<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">6<\/span><div class=\"pb\"><div class=\"alt\"><div class=\"turn\"><span class=\"ja\" role=\"button\" tabindex=\"0\" data-say=\"田中はただ今かいぎちゅうですが、お急ぎでしょうか。\" title=\"눌러서 듣기\"><ruby>田中<rt>たなか<\/rt><\/ruby>はただ<ruby>今<rt>いま<\/rt><\/ruby><ruby>会議中<rt>かいぎちゅう<\/rt><\/ruby>ですが、お<ruby>急<rt>いそ<\/rt><\/ruby>ぎでしょうか。<\/span><span class=\"rom\">Tanaka wa tadaima kaigichū desu ga, oisogi deshō ka.<\/span><\/div><\/div><div class=\"kor\">다나카는 지금 회의 중인데, 급하신가요?<\/div><\/div><\/li><li class=\"ph\"><span class=\"pn\">7<\/span><div class=\"p
